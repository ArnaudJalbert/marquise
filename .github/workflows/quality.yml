name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and unit tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check (ty)
        run: uv run ty check packages/marquise-core/src

      - name: Run unit tests with coverage
        run: |
          uv run pytest packages/marquise-core/tests/unit_tests/ \
            --cov=marquise \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Run API tests
        run: uv run pytest apps/marquise-api/tests/ -q

      - name: Run CLI tests
        run: uv run pytest apps/marquise-cli/tests/ -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  postgres:
    name: PostgreSQL gateway and import regressions
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marquise
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: marquise_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U marquise -d marquise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marquise:test-only@127.0.0.1:5432/marquise_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: Run deterministic integration tests (no production secrets)
        run: uv run pytest packages/marquise-core/tests/integration_tests/ -q

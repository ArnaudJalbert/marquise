name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and unit tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check (ty)
        run: uv run ty check packages/marquise-core/src

      - name: Run unit tests with coverage
        run: |
          uv run pytest packages/marquise-core/tests/unit_tests/ packages/marquise-core/tests/new_tests/ \
            --cov=marquise \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Run API tests
        run: uv run pytest apps/marquise-api/tests/ -q

      - name: Run CLI tests
        run: uv run pytest apps/marquise-cli/tests/ -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

name: Release

on:
  push:
    branches: [main]
    tags:
      - 'marquise-*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Resolve release targets
        id: targets
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          TARGETS="$RUNNER_TEMP/release-targets"
          : > "$TARGETS"
          PYTHON=$(uv python find 3.13)

          read_version() {
            "$PYTHON" - "$1" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          }

          add_target() {
            printf '%s|%s|%s|%s\n' "$4" "$1" "$2" "$3" >> "$TARGETS"
          }

          add_tag_target() {
            local tag=$1
            if [[ "$tag" =~ ^marquise-(core|api|cli)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              local kind=${BASH_REMATCH[1]}
              local tag_version=${BASH_REMATCH[2]}
            else
              echo "::error::Unsupported release tag: $tag"
              exit 1
            fi

            case "$kind" in
              core)
                local package=marquise-core directory=packages/marquise-core distribution=marquise_core
                ;;
              api)
                local package=marquise-api directory=apps/marquise-api distribution=marquise_api
                ;;
              cli)
                local package=marquise-cli directory=apps/marquise-cli distribution=marquise_cli
                ;;
            esac

            local version
            version=$(read_version "$directory/pyproject.toml")
            [[ "$version" == "$tag_version" ]] || {
              echo "::error::Tag version $tag_version != pyproject.toml $version"
              exit 1
            }
            add_target "$package" "$distribution" "$version" "$tag"
          }

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            add_tag_target "$GITHUB_REF_NAME"
          else
            [[ -n "$BASE_SHA" ]] || {
              echo "::error::Missing base commit for version comparison"
              exit 1
            }
            git cat-file -e "$BASE_SHA^{commit}"

            while IFS='|' read -r kind package directory distribution; do
              if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- "$directory/pyproject.toml"; then
                continue
              fi

              version=$(read_version "$directory/pyproject.toml")
              old_version=$(git show "$BASE_SHA:$directory/pyproject.toml" | "$PYTHON" -c '
          import sys
          import tomllib
          print(tomllib.load(sys.stdin.buffer)["project"]["version"])
          ')
              if [[ "$version" == "$old_version" ]]; then
                continue
              fi
              if ! "$PYTHON" - "$old_version" "$version" <<'PY'
          import sys

          old, new = (tuple(map(int, value.split("."))) for value in sys.argv[1:])
          if len(old) != 3 or len(new) != 3 or new <= old:
              raise SystemExit(1)
          PY
              then
                echo "::error::Version must increase: $old_version -> $version"
                exit 1
              fi
              add_target "$package" "$distribution" "$version" "marquise-$kind-v$version"
            done <<'TARGETS'
          core|marquise-core|packages/marquise-core|marquise_core
          api|marquise-api|apps/marquise-api|marquise_api
          cli|marquise-cli|apps/marquise-cli|marquise_cli
          TARGETS
          fi

          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Build, verify, and release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail

          while IFS='|' read -r TAG PACKAGE DISTRIBUTION VERSION; do
            OUTPUT_DIR="$RUNNER_TEMP/release-dist-$PACKAGE"
            uv build --package "$PACKAGE" --out-dir "$OUTPUT_DIR" --clear --no-create-gitignore

            SDIST="$OUTPUT_DIR/$DISTRIBUTION-$VERSION.tar.gz"
            WHEEL="$OUTPUT_DIR/$DISTRIBUTION-$VERSION-py3-none-any.whl"
            [[ -f "$SDIST" && -f "$WHEEL" ]] || {
              echo "::error::Expected release distributions were not built"
              exit 1
            }
            [[ $(find "$OUTPUT_DIR" -maxdepth 1 -type f | wc -l) -eq 2 ]] || {
              echo "::error::Unexpected files in release output"
              exit 1
            }

            if [[ "$GITHUB_EVENT_NAME" != push ]]; then
              continue
            fi
            if gh release view "$TAG" > /dev/null 2>&1; then
              continue
            fi
            if [[ "$GITHUB_REF_TYPE" == branch ]]; then
              git fetch --tags --force
              if git show-ref --verify --quiet "refs/tags/$TAG"; then
                [[ $(git rev-list -n 1 "$TAG") == "$GITHUB_SHA" ]] || {
                  echo "::error::Existing tag $TAG points to another commit"
                  exit 1
                }
              fi
              gh release create "$TAG" "$SDIST" "$WHEEL" \
                --target "$GITHUB_SHA" \
                --title "$PACKAGE v$VERSION" \
                --generate-notes
            else
              gh release create "$TAG" "$SDIST" "$WHEEL" \
                --title "$PACKAGE v$VERSION" \
                --generate-notes
            fi
          done < "$TARGETS"

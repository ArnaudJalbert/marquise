name: Release

on:
  push:
    tags:
      - 'marquise-core-v*'
      - 'marquise-api-v*'
      - 'marquise-cli-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Parse tag
        id: parse
        run: |
          TAG=${{ github.ref_name }}
          if [[ $TAG == marquise-core-v* ]]; then
            echo "package=marquise-core" >> $GITHUB_OUTPUT
            echo "directory=packages/marquise-core" >> $GITHUB_OUTPUT
          elif [[ $TAG == marquise-api-v* ]]; then
            echo "package=marquise-api" >> $GITHUB_OUTPUT
            echo "directory=apps/marquise-api" >> $GITHUB_OUTPUT
          elif [[ $TAG == marquise-cli-v* ]]; then
            echo "package=marquise-cli" >> $GITHUB_OUTPUT
            echo "directory=apps/marquise-cli" >> $GITHUB_OUTPUT
          fi
          VERSION=${TAG#*-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify tag matches pyproject.toml
        run: |
          INI_VER=$(python3 -c "
            import tomllib
            with open('${{ steps.parse.outputs.directory }}/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          [[ "$INI_VER" == "${{ steps.parse.outputs.version }}" ]] || {
            echo "::error::Tag version ${{ steps.parse.outputs.version }} != pyproject.toml $INI_VER"
            exit 1
          }
          echo "✓ Version verified"

      - name: Build
        run: uv build --package ${{ steps.parse.outputs.package }}

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --package ${{ steps.parse.outputs.package }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.parse.outputs.package }} v${{ steps.parse.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.parse.outputs.directory }}/dist/*

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Lint, format, and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check (ty)
        run: uv run ty check packages/marquise-core/src

      - name: Run unit tests with coverage
        run: |
          uv run pytest packages/marquise-core/tests/unit_tests/ \
            --cov=marquise \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify required secrets are set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          [[ -z "$DATABASE_URL" ]] && missing+=("DATABASE_URL")
          [[ -z "$SUPABASE_URL" ]] && missing+=("SUPABASE_URL")
          [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]] && missing+=("SUPABASE_PUBLISHABLE_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: uv run pytest packages/marquise-core/tests/integration_tests/ -v

  release-checks:
    name: Version bump + CHANGELOG
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/marquise-core/src/**'
              - 'packages/marquise-core/pyproject.toml'
            api:
              - 'apps/marquise-api/src/**'
              - 'apps/marquise-api/pyproject.toml'
            cli:
              - 'apps/marquise-cli/src/**'
              - 'apps/marquise-cli/pyproject.toml'

      - name: Check marquise-core version bump
        if: steps.filter.outputs.core == 'true'
        run: |
          MAIN_VER=$(git show origin/${{ github.base_ref }}:packages/marquise-core/pyproject.toml \
            | python3 -c "import sys,tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])")
          PR_VER=$(python3 -c "import tomllib; print(tomllib.load(open('packages/marquise-core/pyproject.toml','rb'))['project']['version'])")
          python3 -c "import sys;v1=[int(x) for x in sys.argv[1].split('.')];v2=[int(x) for x in sys.argv[2].split('.')];assert v2>v1, f'Version must increase: {sys.argv[1]} → {sys.argv[2]}';print(f'✓ {sys.argv[1]} → {sys.argv[2]}')" "$MAIN_VER" "$PR_VER"
          echo "new_ver=$PR_VER" >> $GITHUB_ENV

      - name: Check marquise-core CHANGELOG
        if: steps.filter.outputs.core == 'true'
        env:
          NEW_VER: ${{ env.new_ver }}
        run: |
          grep -qF "### v$NEW_VER" packages/marquise-core/CHANGELOG.md || {
            echo "::error::Missing CHANGELOG entry for marquise-core v$NEW_VER"
            exit 1
          }
          echo '✓ CHANGELOG entry found'

      - name: Check marquise-api version bump
        if: steps.filter.outputs.api == 'true'
        run: |
          MAIN_VER=$(git show origin/${{ github.base_ref }}:apps/marquise-api/pyproject.toml \
            | python3 -c "import sys,tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])")
          PR_VER=$(python3 -c "import tomllib; print(tomllib.load(open('apps/marquise-api/pyproject.toml','rb'))['project']['version'])")
          python3 -c "import sys;v1=[int(x) for x in sys.argv[1].split('.')];v2=[int(x) for x in sys.argv[2].split('.')];assert v2>v1, f'Version must increase: {sys.argv[1]} → {sys.argv[2]}';print(f'✓ {sys.argv[1]} → {sys.argv[2]}')" "$MAIN_VER" "$PR_VER"
          echo "new_ver=$PR_VER" >> $GITHUB_ENV

      - name: Check marquise-api CHANGELOG
        if: steps.filter.outputs.api == 'true'
        env:
          NEW_VER: ${{ env.new_ver }}
        run: |
          grep -qF "### v$NEW_VER" apps/marquise-api/CHANGELOG.md || {
            echo "::error::Missing CHANGELOG entry for marquise-api v$NEW_VER"
            exit 1
          }
          echo '✓ CHANGELOG entry found'

      - name: Check marquise-cli version bump
        if: steps.filter.outputs.cli == 'true'
        run: |
          MAIN_VER=$(git show origin/${{ github.base_ref }}:apps/marquise-cli/pyproject.toml \
            | python3 -c "import sys,tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])")
          PR_VER=$(python3 -c "import tomllib; print(tomllib.load(open('apps/marquise-cli/pyproject.toml','rb'))['project']['version'])")
          python3 -c "import sys;v1=[int(x) for x in sys.argv[1].split('.')];v2=[int(x) for x in sys.argv[2].split('.')];assert v2>v1, f'Version must increase: {sys.argv[1]} → {sys.argv[2]}';print(f'✓ {sys.argv[1]} → {sys.argv[2]}')" "$MAIN_VER" "$PR_VER"
          echo "new_ver=$PR_VER" >> $GITHUB_ENV

      - name: Check marquise-cli CHANGELOG
        if: steps.filter.outputs.cli == 'true'
        env:
          NEW_VER: ${{ env.new_ver }}
        run: |
          grep -qF "### v$NEW_VER" apps/marquise-cli/CHANGELOG.md || {
            echo "::error::Missing CHANGELOG entry for marquise-cli v$NEW_VER"
            exit 1
          }
          echo '✓ CHANGELOG entry found'

      - name: Build and verify changed package distributions
        run: |
          set -euo pipefail

          PYTHON=$(uv python find 3.13)
          for target in \
            'marquise-core|packages/marquise-core|marquise_core|${{ steps.filter.outputs.core }}' \
            'marquise-api|apps/marquise-api|marquise_api|${{ steps.filter.outputs.api }}' \
            'marquise-cli|apps/marquise-cli|marquise_cli|${{ steps.filter.outputs.cli }}'; do
            IFS='|' read -r PACKAGE DIRECTORY DISTRIBUTION CHANGED <<< "$target"
            [[ "$CHANGED" == true ]] || continue

            VERSION=$("$PYTHON" - "$DIRECTORY/pyproject.toml" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
            )
            OUTPUT_DIR="$RUNNER_TEMP/release-dist-$PACKAGE"
            uv build --package "$PACKAGE" --out-dir "$OUTPUT_DIR" --clear --no-create-gitignore

            [[ -f "$OUTPUT_DIR/$DISTRIBUTION-$VERSION.tar.gz" ]]
            [[ -f "$OUTPUT_DIR/$DISTRIBUTION-$VERSION-py3-none-any.whl" ]]
            [[ $(find "$OUTPUT_DIR" -maxdepth 1 -type f | wc -l) -eq 2 ]]
          done

      - name: Nothing to check
        if: >
          steps.filter.outputs.core != 'true' &&
          steps.filter.outputs.api != 'true' &&
          steps.filter.outputs.cli != 'true'
        run: echo 'No package source or pyproject.toml changes detected'

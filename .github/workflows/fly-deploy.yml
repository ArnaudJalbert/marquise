# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test production API
        env:
          BASE_URL: https://marquise-api.fly.dev
        run: |
          set -euo pipefail

          check() {
            local path="$1"
            # --retry handles the scale-to-zero cold start on the first request.
            if ! curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused \
                 -o /tmp/response.json -w '%{http_code}' "${BASE_URL}${path}" > /tmp/status.txt; then
              echo "::error::${path} failed to respond"
              cat /tmp/response.json 2>/dev/null || true
              exit 1
            fi
            echo "${path} -> $(cat /tmp/status.txt) $(cat /tmp/response.json)"
          }

          check "/health"
          check "/ready"
          check "/v1/cinemas?size=1"

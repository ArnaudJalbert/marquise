# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.filter.outputs.api }}
      interface: ${{ steps.filter.outputs.interface }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/marquise-api/**'
              - 'packages/marquise-core/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.dockerignore'
              - '.github/workflows/fly-deploy.yml'
            interface:
              - 'web/**'
              - 'Makefile'
              - '.github/workflows/fly-deploy.yml'

  deploy-api:
    name: Deploy marquise-api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    concurrency: deploy-api-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: make deploy-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test production API
        env:
          BASE_URL: https://marquise-api.fly.dev
        run: |
          set -euo pipefail

          check() {
            local path="$1"
            # --retry handles the scale-to-zero cold start on the first request.
            if ! curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused \
                 -o /tmp/response.json -w '%{http_code}' "${BASE_URL}${path}" > /tmp/status.txt; then
              echo "::error::${path} failed to respond"
              cat /tmp/response.json 2>/dev/null || true
              exit 1
            fi
            echo "${path} -> $(cat /tmp/status.txt) $(cat /tmp/response.json)"
          }

          check "/health"
          check "/ready"
          check "/v1/cinemas?size=1"

  deploy-interface:
    name: Deploy marquise-interface
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-24.04
    concurrency: deploy-interface-group
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: make deploy-interface
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test production interface
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused \
            -o /dev/null -w 'https://marquise-interface.fly.dev -> %{http_code}\n' \
            https://marquise-interface.fly.dev/

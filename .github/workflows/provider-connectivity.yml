name: Provider connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-providers:
    name: Cineplex and CinemaCinema live connectivity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: Check both provider endpoints
        run: uv run pytest packages/marquise-core/tests/provider_smoke_tests/ -v

name: Integration

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (isolated PostgreSQL and local HTTP)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marquise
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: marquise_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U marquise -d marquise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marquise:test-only@127.0.0.1:5432/marquise_test

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv python install 3.13
      - run: uv sync --group dev
      - name: Run deterministic integration tests
        run: uv run pytest packages/marquise-core/tests/integration_tests/ -q

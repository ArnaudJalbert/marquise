name: Scheduled import

concurrency:
  group: marquise-import
  cancel-in-progress: false

on:
  schedule:
    # Nightly at 07:17 UTC (02:17 EST, 03:17 EDT); offset avoids top-of-hour load
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to import (today inclusive)"
        required: false
        default: "31"

jobs:
  import-supabase:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Import showtimes for all cinemas
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run bulk import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SCHEMA: marquise
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: uv run marquise import all --days "${{ github.event.inputs.days || '31' }}"

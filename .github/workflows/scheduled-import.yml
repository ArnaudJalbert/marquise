name: Scheduled import

concurrency:
  group: marquise-import
  cancel-in-progress: false

on:
  schedule:
    # Nightly at 07:17 UTC (≈ 02:17–03:17 America/Montreal); offset avoids top-of-hour load
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to import (today inclusive)"
        required: false
        default: "7"

jobs:
  import-supabase:
    if: github.event_name == 'schedule'
    name: Import showtimes for all cinemas
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run bulk import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: uv run marquise import all --days "${{ github.event.inputs.days || '7' }}"

  import-fly:
    if: github.event_name == 'workflow_dispatch'
    name: Import showtimes on a temporary Fly Machine
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Check Fly import secrets
        run: |
          set -euo pipefail
          if ! flyctl secrets list --app marquise-db | grep -q 'TMDB_API_KEY'; then
            echo "TMDB_API_KEY must be configured as a Fly secret on marquise-db" >&2
            exit 1
          fi

      - name: Build CLI image
        env:
          IMAGE_LABEL: import-${{ github.sha }}
        run: |
          set -euo pipefail
          flyctl deploy . --config deploy/import/fly.toml --app marquise-db \
            --build-only --push --image-label "$IMAGE_LABEL" --yes

      - name: Start the private PostgreSQL Machine
        id: database
        run: |
          set -euo pipefail
          machine_id=$(flyctl machines list --app marquise-db --json |
            jq -r '[.[] | select(.image_ref.repository == "library/postgres")][0].id // empty')
          if [[ -z "$machine_id" ]]; then
            echo "PostgreSQL Machine was not found in marquise-db" >&2
            exit 1
          fi
          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"
          flyctl machine update "$machine_id" --app marquise-db \
            --autostop=off --skip-start --yes
          flyctl machine start "$machine_id" --app marquise-db
          for attempt in {1..30}; do
            if flyctl checks list --app marquise-db --json |
              jq -e 'all(.[]; length > 0 and all(.[]; .status == "passing"))' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "PostgreSQL health checks did not pass" >&2
          exit 1

      - name: Run import on a temporary Machine
        env:
          DAYS: ${{ inputs.days || '7' }}
          FLY_IMAGE: registry.fly.io/marquise-db:import-${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/run_fly_import.sh

      - name: Restore PostgreSQL autostop and stop it
        if: always() && steps.database.outputs.machine_id != ''
        env:
          DATABASE_MACHINE_ID: ${{ steps.database.outputs.machine_id }}
        run: |
          set -euo pipefail
          flyctl machine update "$DATABASE_MACHINE_ID" --app marquise-db \
            --autostop=stop --skip-start --yes

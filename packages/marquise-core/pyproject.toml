[project]
name = "marquise-core"
version = "0.1.0"
description = "Montreal cinema showtimes aggregator — core domain, application, and infrastructure layers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "certifi>=2024.0.0",
    "fastapi>=0.138.1",
    "fastapi-cache2>=0.2.2",
    "fastapi-pagination>=0.15.15",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "slowapi>=0.1.10",
    "supabase>=2.31.0",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
marquise = "marquise.infrastructure.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marquise"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["marquise"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70

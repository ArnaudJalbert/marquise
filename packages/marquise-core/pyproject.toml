[project]
name = "marquise-core"
version = "0.2.16"
description = "Montreal cinema showtimes aggregator — core domain, application, and infrastructure layers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "certifi>=2024.0.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://marquise.ca"
Repository = "https://github.com/ArnaudJalbert/marquise"
Changelog = "https://github.com/ArnaudJalbert/marquise/blob/main/packages/marquise-core/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marquise"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["marquise"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70

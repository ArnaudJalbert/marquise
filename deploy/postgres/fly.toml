# Self-managed PostgreSQL. Only a private Flycast service is configured.
app = "marquise-db"
primary_region = "yyz"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  # PostgreSQL 17.11, same manifest exercised by the disposable database tests.
  image = "postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3"

[env]
  POSTGRES_USER = "marquise"
  POSTGRES_DB = "marquise"
  PGDATA = "/data/pgdata"
  POSTGRES_INITDB_ARGS = "--auth-host=scram-sha-256"

[processes]
  app = "postgres -c listen_addresses=* -c shared_buffers=64MB -c max_connections=30"

[[mounts]]
  source = "pg_data"
  destination = "/data"
  initial_size = "1gb"

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[services.ports]]
    port = 5432

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[checks.postgres]
  type = "tcp"
  port = 5432
  interval = "15s"
  timeout = "2s"
  grace_period = "30s"

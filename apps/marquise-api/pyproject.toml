[project]
name = "marquise-api"
version = "0.1.4"
description = "Marquise read-only REST API"
requires-python = ">=3.13"
dependencies = [
    "marquise-core",
    "fastapi>=0.138.1",
    "fastapi-cache2>=0.2.2",
    "fastapi-pagination>=0.15.15",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
marquise-api = "marquise_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marquise_api"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

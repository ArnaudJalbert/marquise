[project]
name = "marquise-cli"
version = "0.1.0"
description = "Marquise administration CLI"
requires-python = ">=3.13"
dependencies = [
    "marquise-core",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
marquise = "marquise_cli.app:app"
marquise-cli = "marquise_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marquise_cli"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

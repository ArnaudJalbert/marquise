[project]
name = "marquise-cli"
version = "0.1.11"
description = "Marquise administration CLI"
requires-python = ">=3.13"
dependencies = [
    "marquise-core>=0.2.11",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://marquise.ca"
Repository = "https://github.com/ArnaudJalbert/marquise"
Changelog = "https://github.com/ArnaudJalbert/marquise/blob/main/apps/marquise-cli/CHANGELOG.md"

[project.scripts]
marquise = "marquise_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marquise_cli"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

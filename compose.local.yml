# Self-contained local integration. Use `make local-up`; no .env is read.
name: marquise-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marquise_local
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: marquise_local
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./scripts/marquise-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./local/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U marquise_local -d marquise_local"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/marquise-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://marquise_local:local-only@db:5432/marquise_local
      DATABASE_SCHEMA: marquise
      MARQUISE_API_CACHE_TTL_SECONDS: "1"
    ports:
      - "127.0.0.1:8300:8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 3s
      timeout: 4s
      retries: 30

  web:
    build:
      context: web
      dockerfile: ../local/interface.Dockerfile
    ports:
      - "127.0.0.1:4300:80"
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./local/posters:/usr/share/nginx/html/local-posters:ro
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  database:

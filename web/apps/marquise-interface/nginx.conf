server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Avoid routine visitor/request logs; retain error diagnostics.
    access_log off;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

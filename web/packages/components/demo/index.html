<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimalist catalogue prototype · Marquise</title>
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .review-notice,
      .review-tools {
        font:
          12px/1.5 Arial,
          sans-serif;
        padding: 12px 16px;
        background: #f2f2f2;
        color: #000;
      }
      .review-notice {
        text-align: center;
      }
      .review-tools {
        max-width: 912px;
        margin: 32px auto;
        border: 1px solid #ddd;
      }
      .review-tools button,
      .review-tools select {
        font: inherit;
        min-height: 44px;
        background: #fff;
        color: #000;
        border: 1px solid #aaa;
        margin: 4px;
        padding: 8px;
      }
      .review-tools pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

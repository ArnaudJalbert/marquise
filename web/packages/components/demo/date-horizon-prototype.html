<!doctype html>
<!-- PROTOTYPE, throwaway. Question: how far ahead should the date control reach, and how does it collapse when sticky? -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --indigo:#6366f1; --deep:#4f46e5; --ink:var(--foreground,#18181b); --mute:var(--muted-foreground,#71717a); --line:var(--border,#e4e4e7); --bg:var(--background,#fff); }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); padding:4px 0 8px; }
  button { font:inherit; cursor:pointer; color:inherit; }
  #bar { display:inline-flex; flex-wrap:wrap; gap:4px; background:#18181b; padding:5px; border-radius:999px; margin-bottom:10px; }
  #bar button { border:0; background:transparent; color:#a1a1aa; padding:7px 14px; border-radius:999px; font-size:13px; }
  #bar button.on { background:#fff; color:#18181b; }
  .q { color:var(--mute); margin:0 0 12px; font-size:13px; }
  .vp { height:540px; overflow:auto; border:1px solid var(--line); border-radius:var(--radius,10px); position:relative; }
  #head { position:sticky; top:0; z-index:2; background:var(--bg); padding:16px 16px 12px; border-bottom:1px solid var(--line); user-select:none; }
  #head.compact { padding:8px 12px; box-shadow:0 6px 16px #0002; }
  .big { font-size:28px; font-weight:650; letter-spacing:-.02em; display:flex; align-items:center; gap:10px; }
  .sub { color:var(--mute); font-size:13px; margin:2px 0 12px; }
  .step { border:1px solid var(--line); background:transparent; border-radius:999px; width:32px; height:32px; display:grid; place-items:center; color:var(--mute); flex:none; }
  .step:hover { color:var(--ink); border-color:var(--ink); }
  .step:disabled { opacity:.3; pointer-events:none; }
  .row { display:flex; align-items:center; gap:8px; }
  .row .t { font-weight:650; white-space:nowrap; min-width:120px; }
  .row .step { width:26px; height:26px; }
  .row svg { flex:1; min-width:0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip { border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 11px; font-size:13px; }
  .chip.on { background:var(--deep); border-color:var(--deep); color:#fff; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; gap:2px; }
  .seg button { border:0; background:none; border-radius:999px; padding:3px 10px; font-size:12px; color:var(--mute); }
  .seg button.on { background:var(--ink); color:var(--bg); }
  svg.brush { width:100%; height:auto; display:block; touch-action:none; }
  svg .bar { fill:#a1a1aa; opacity:.55; }
  svg .bar.in { fill:var(--indigo); opacity:1; }
  svg .win { fill:#6366f122; stroke:var(--deep); stroke-width:1.5; cursor:grab; }
  svg .h { fill:var(--deep); cursor:ew-resize; }
  svg text { font-size:12px; fill:var(--mute); }
  svg .ln { stroke:var(--line); }
  svg .today { stroke:#f59e0b; stroke-width:2; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:10px 0 4px; }
  .strip { display:flex; overflow-x:auto; background:#111; padding:10px 0; border-radius:6px; scrollbar-width:none; }
  .frame { flex:0 0 60px; height:70px; margin:0 3px; border-radius:3px; background:#27272a; color:#d4d4d8; display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none; position:relative; }
  .frame .wd { font-size:10px; text-transform:uppercase; opacity:.7; }
  .frame .d { font-size:20px; font-weight:650; }
  .frame .m { position:absolute; top:2px; left:4px; font-size:9px; color:#f59e0b; text-transform:uppercase; }
  .frame.empty { opacity:.45; }
  .frame.sel { background:var(--indigo); color:#fff; opacity:1; }
  .later { display:grid; grid-template-columns:repeat(7, 38px); gap:3px; margin-top:8px; }
  .later span { font-size:10px; color:var(--mute); text-align:center; }
  .later button { height:32px; border:0; border-radius:6px; background:#6366f114; font-size:12px; }
  .later button.sel { background:var(--indigo); color:#fff; }
  .later button.pend { background:var(--deep); color:#fff; }
  .res { padding:8px 16px 40px; min-height:700px; }
  .res h4 { margin:18px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); }
  .res .f { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .res .f small { color:var(--mute); font-variant-numeric:tabular-nums; }
  #state { margin-top:12px; font:12px/1.5 ui-monospace,monospace; border:1px dashed var(--line); border-radius:8px; padding:8px 12px; white-space:pre; color:var(--mute); }
</style>
</head>
<body>
<div id="bar"></div>
<p class="q" id="q"></p>
<div class="vp" id="vp"><div id="head"></div><div class="res" id="res"></div></div>
<div id="state"></div>
<script>
const N = 90, T0 = Date.UTC(2026, 10, 2, 12);
const day = (o) => new Date(T0 + o * 864e5);
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const wd = (o) => day(o).getUTCDay(), dn = (o) => day(o).getUTCDate(), mo = (o) => MO[day(o).getUTCMonth()];
const short = (o) => `${WD[wd(o)]} ${mo(o)} ${dn(o)}`;
// Realistic shape: dense for ~5 weeks, then cinemas have barely published anything.
const counts = Array.from({ length: N }, (_, o) => {
  const w = wd(o);
  if (o < 35) return Math.max(1, Math.round([9, 4, 5, 6, 8, 14, 17][w] + Math.sin(o * 2.3) * 4));
  if (o < 49) return [5, 6].includes(w) ? 3 + (o % 3) : o % 4 === 0 ? 1 : 0;
  return [5, 6].includes(w) && o % 3 === 0 ? 2 : o === 60 ? 6 : 0; // Dec 31 special
});
const MAX = Math.max(...counts);
const FILMS = ["Paris, Texas","In the Mood for Love","Perfect Days","Stalker","La Haine","Tampopo","Aftersun","Mon oncle","Close-Up","Chungking Express","Le Samouraï","Portrait of a Lady on Fire"];
const CIN = ["Cinéma du Parc","Cinémathèque","Cinéma Moderne","Beaubien"];
const S = { start: 4, end: 6 }, UI = { v: "a", compact: false, zoom: 42, later: false, pend: null, src: null };
const len = () => S.end - S.start + 1, total = () => counts.slice(S.start, S.end + 1).reduce((a, b) => a + b, 0);
const nextWd = (t, f = 0) => { let o = f; while (wd(o) !== t) o++; return o; };
const clamp = (v) => Math.max(0, Math.min(N - 1, v));
function named() {
  const s = S.start, e = S.end, fri = nextWd(5), mon = nextWd(1, 1);
  if (s === e) return s === 0 ? "Today" : s === 1 ? "Tomorrow" : short(s);
  if (s === fri && e === fri + 2) return "This weekend";
  if (s === fri + 7 && e === fri + 9) return "Next weekend";
  if (s === 0 && e === 6) return "Next 7 days";
  if (s === mon && e === mon + 6) return "Next week";
  if (wd(s) === 5 && e === s + 2) return `Weekend of ${mo(s)} ${dn(s)}`;
  if (wd(s) === 1 && e === s + 6) return `Week of ${mo(s)} ${dn(s)}`;
  return null;
}
const rangeText = () => S.start === S.end ? short(S.start) : `${short(S.start)} → ${short(S.end)}`;
const title = () => named() ?? rangeText();
function set(s, e, src = null) { s = clamp(s); e = clamp(e); if (e < s) [s, e] = [e, s]; if (s === S.start && e === S.end) return; S.start = s; S.end = e; UI.src = src; render(); }
function shift(d) { const k = /week/i.test(named() ?? "") ? 7 : len(); if (S.start + d * k < 0 || S.end + d * k > N - 1) return; set(S.start + d * k, S.end + d * k); }
const PRESETS = [["Today", () => [0, 0]], ["Tomorrow", () => [1, 1]], ["This weekend", () => { const f = nextWd(5); return [f, f + 2]; }], ["Next 7 days", () => [0, 6]], ["Next weekend", () => { const f = nextWd(5) + 7; return [f, f + 2]; }]];
const chips = (extra = "") => `<div class="chips">${PRESETS.map(([l, f]) => { const [a, b] = f(); return `<button class="chip ${a === S.start && b === S.end ? "on" : ""}" data-p="${l}">${l}</button>`; }).join("")}${extra}</div>`;
const hero = () => `<div class="big"><button class="step" data-s="-1" ${S.start === 0 ? "disabled" : ""}>‹</button><span>${title()}</span><button class="step" data-s="1">›</button></div>
  <div class="sub">${named() ? rangeText() + " · " : ""}${len()} day${len() > 1 ? "s" : ""} · ${total()} screenings</div>`;
const compactRow = (inner) => `<div class="row"><button class="step" data-s="-1" ${S.start === 0 ? "disabled" : ""}>‹</button><span class="t">${title()}</span><button class="step" data-s="1">›</button>${inner}</div>`;

// One brush over days a..b. H = bar area height; lab = draw axis labels.
function brush(id, a, b, H, lab) {
  const n = b - a + 1, W = 840 / n, VH = H + (lab ? 20 : 2);
  let g = "";
  for (let o = a; o <= b; o++) {
    const x = (o - a) * W, h = counts[o] ? Math.max(2, (counts[o] / MAX) * (H - 8)) : 1;
    const line = n <= 42 ? wd(o) === 1 : dn(o) === 1;
    if (line) g += `<line class="ln" x1="${x}" x2="${x}" y1="0" y2="${H}"/>`;
    if (lab) {
      if (n <= 14) g += `<text x="${x + W / 2}" y="${H + 15}" text-anchor="middle">${WD[wd(o)][0]}${dn(o)}</text>`;
      else if (line) g += `<text x="${x + 3}" y="${H + 15}">${n <= 42 ? `${mo(o)} ${dn(o)}` : mo(o)}</text>`;
    }
    g += `<rect class="bar ${o >= S.start && o <= S.end ? "in" : ""}" x="${x + W * .15}" y="${H - h}" width="${W * .7}" height="${h}" rx="${Math.min(2, W * .2)}"/>`;
  }
  if (a === 0) g += `<line class="today" x1="1" x2="1" y1="0" y2="${H}"/>`;
  const s = Math.max(S.start, a), e = Math.min(S.end, b);
  if (s <= e) {
    const x0 = (s - a) * W, x1 = (e - a + 1) * W, hh = Math.min(26, H - 6);
    g += `<rect class="win" x="${x0}" y="1" width="${x1 - x0}" height="${H - 2}" rx="3"/>`;
    g += `<rect class="h" data-h="l" x="${x0 - 3}" y="${(H - hh) / 2}" width="6" height="${hh}" rx="3"/><rect class="h" data-h="r" x="${x1 - 3}" y="${(H - hh) / 2}" width="6" height="${hh}" rx="3"/>`;
  }
  return `<svg class="brush" data-id="${id}" data-a="${a}" data-b="${b}" viewBox="0 0 840 ${VH}">${g}</svg>`;
}
let DRAG = null;
function dayAt(e) {
  const svg = document.querySelector(`svg[data-id="${DRAG.id}"]`); const r = svg.getBoundingClientRect();
  const a = +svg.dataset.a, n = +svg.dataset.b - a + 1;
  return clamp(a + Math.floor(Math.max(0, Math.min(.999, (e.clientX - r.left) / r.width)) * n));
}
function wire(root) {
  root.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => shift(+b.dataset.s));
  root.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => set(...PRESETS.find((p) => p[0] === b.dataset.p)[1]()));
  root.querySelectorAll("[data-z]").forEach((b) => b.onclick = () => { UI.zoom = +b.dataset.z; render(); });
  root.querySelectorAll("svg.brush").forEach((svg) => svg.onpointerdown = (e) => {
    e.preventDefault();
    DRAG = { id: svg.dataset.id, s0: S.start, e0: S.end, mode: e.target.dataset.h ?? (e.target.classList.contains("win") ? "move" : "new") };
    DRAG.a0 = dayAt(e); if (DRAG.mode === "new") set(DRAG.a0, DRAG.a0, "brush");
  });
  root.querySelectorAll(".strip").forEach((st) => {
    st.scrollLeft = UI.src === "strip" ? UI.scroll : Math.max(0, S.start * 66 - 66);
    st.onscroll = () => UI.scroll = st.scrollLeft;
    st.onpointerdown = (e) => { const f = e.target.closest(".frame"); if (!f) return; DRAG = { mode: "strip", a0: +f.dataset.o }; set(DRAG.a0, DRAG.a0, "strip"); };
  });
  root.querySelectorAll("[data-l]").forEach((b) => b.onclick = () => { const o = +b.dataset.l; if (UI.pend === null) { UI.pend = o; render(); } else { const p = UI.pend; UI.pend = null; set(p, o); } });
  root.querySelectorAll("[data-later]").forEach((b) => b.onclick = () => { UI.later = !UI.later; UI.pend = null; render(); });
}
document.onpointermove = (e) => {
  if (!DRAG) return;
  if (DRAG.mode === "strip") { const f = document.elementFromPoint(e.clientX, e.clientY)?.closest(".frame"); if (f) set(DRAG.a0, +f.dataset.o, "strip"); return; }
  const o = dayAt(e), { s0, e0, a0 } = DRAG;
  if (DRAG.mode === "move") { const d = Math.max(-s0, Math.min(N - 1 - e0, o - a0)); set(s0 + d, e0 + d, "brush"); }
  else if (DRAG.mode === "l") set(Math.min(o, e0), e0, "brush");
  else if (DRAG.mode === "r") set(s0, Math.max(o, s0), "brush");
  else set(a0, o, "brush");
};
document.onpointerup = () => DRAG = null;

const V = {
  a: { name: "6-week brush", q: "Fixed 6-week horizon, the default view. 'Later…' opens a small grid for anything past it. Scroll the results to see the sticky state.",
    head(c) {
      if (c) return compactRow(brush("a-mini", 0, 41, 26, false));
      const later = UI.later ? `<div class="later">${["M","T","W","T","F","S","S"].map((d) => `<span>${d}</span>`).join("")}${Array.from({ length: 48 }, (_, i) => { const o = 42 + i; return `<button data-l="${o}" class="${UI.pend === o ? "pend" : o >= S.start && o <= S.end ? "sel" : ""}">${dn(o) === 1 ? mo(o) : dn(o)}</button>`; }).join("")}</div>` : "";
      return hero() + brush("a", 0, 41, 80, true) + chips(`<button class="chip ${S.end > 41 ? "on" : ""}" data-later>Later…</button>`) + later;
    } },
  b: { name: "Filmstrip + overview", q: "Unlimited filmstrip for detail, with a thin 3-month overview above it that you can also drag. Sticky state keeps only the overview.",
    head(c) {
      const ov = brush(c ? "b-mini" : "b-ov", 0, N - 1, c ? 26 : 34, !c);
      if (c) return compactRow(ov);
      const strip = `<div class="strip">${counts.map((n, o) => `<div class="frame ${n ? "" : "empty"} ${o >= S.start && o <= S.end ? "sel" : ""}" data-o="${o}">${dn(o) === 1 || o === 0 ? `<span class="m">${mo(o)}</span>` : ""}<span class="wd">${WD[wd(o)]}</span><span class="d">${dn(o)}</span></div>`).join("")}</div>`;
      return hero() + `<div class="lbl">Next 3 months</div>` + ov + `<div class="lbl">Days</div>` + strip + chips();
    } },
  c: { name: "Zoomable brush", q: "Same brush, but you pick the horizon: 2 weeks shows every day, 3 months shows the long tail. Stepping past the edge zooms out.",
    head(c) {
      const seg = `<div class="seg">${[[14, "2 wk"], [42, "6 wk"], [90, "3 mo"]].map(([z, l]) => `<button data-z="${z}" class="${UI.zoom === z ? "on" : ""}">${l}</button>`).join("")}</div>`;
      if (c) return compactRow(brush("c-mini", 0, UI.zoom - 1, 26, false) + seg);
      return hero() + `<div style="margin-bottom:8px">${seg}</div>` + brush("c", 0, UI.zoom - 1, 80, true) + chips();
    } },
};

function results() {
  let h = "";
  for (let o = S.start; o <= S.end; o++) {
    h += `<h4>${short(o)} · ${counts[o]} screenings</h4>`;
    if (!counts[o]) { h += `<div class="f"><span style="color:var(--mute)">Nothing published yet</span></div>`; continue; }
    for (let i = 0; i < Math.min(4, counts[o]); i++) {
      const k = (o * 5 + i * 7) % FILMS.length;
      h += `<div class="f"><span>${FILMS[k]}</span><small>${CIN[(o + i) % 4]} · ${13 + ((k + i) % 9)}:${i % 2 ? "30" : "00"}</small></div>`;
    }
  }
  return h;
}
function render() {
  if (UI.v === "c" && S.end > UI.zoom - 1) UI.zoom = S.end > 41 ? 90 : 42;
  const v = V[UI.v], head = document.getElementById("head");
  head.className = UI.compact ? "compact" : "";
  head.innerHTML = v.head(UI.compact); wire(head);
  document.getElementById("res").innerHTML = results();
  document.getElementById("q").textContent = v.q;
  document.getElementById("bar").innerHTML = Object.entries(V).map(([k, x]) => `<button class="${k === UI.v ? "on" : ""}" data-v="${k}">${k.toUpperCase()} ${x.name}</button>`).join("");
  document.querySelectorAll("#bar button").forEach((b) => b.onclick = () => { UI.v = b.dataset.v; UI.later = false; document.getElementById("vp").scrollTop = 0; UI.compact = false; render(); });
  document.getElementById("state").textContent = `variant ${UI.v} · ${UI.compact ? "sticky (compact)" : "hero"}${UI.v === "c" ? ` · zoom ${UI.zoom}d` : ""}\nrange   ${rangeText()} (${len()}d, ${total()} screenings)\nnamed   ${named() ?? "—"}`;
}
const vp = document.getElementById("vp");
vp.onscroll = () => {
  const c = UI.compact ? vp.scrollTop > 20 : vp.scrollTop > 140; // hysteresis so it doesn't flicker
  if (c !== UI.compact) { UI.compact = c; render(); }
};
render();
</script>
</body>
</html>

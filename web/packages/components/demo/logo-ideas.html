<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marquise logo ideas: cinema themes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); }
  body.standalone { background: #0b0d10; color: #f1f3f5; padding: 32px; --font-mono: ui-monospace, monospace; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { border: 1px solid #35414d; border-radius: 12px; overflow: hidden; }
  .art { aspect-ratio: 1; display: grid; place-items: center; }
  .art svg { width: 74%; height: 74%; }
  .meta { padding: 8px 10px; font: 11px var(--font-mono); color: #c3ccd5; background: #222c36; }
  .meta b { color: #f1f3f5; font-weight: 600; }
</style>
</head>
<body>
<div class="grid" id="ideas"></div>
<script>
if (window.self === window.top) document.body.classList.add("standalone");

const CREAM = "#faf6f0", INK = "#1d1a24", DARK = "#14181c";
const sunset = { c: "#ff7a59", b: "#ffc94a", o: "#e5386d" };
const dusk = { c: "#3d348b", b: "#f7b801", o: "#f35b04" };
const candy = { c: "#5e9cff", b: "#ffd166", o: "#06d6a0" };
const berry = { c: "#7f5af0", b: "#ff8fab", o: "#d63af9" };
const lagoon = { c: "#2ec4b6", b: "#ffbf69", o: "#ff6b6b" };

let uid = 0;
// Shapes are functions attrs -> svg element, so the same geometry fills, masks and overlaps.
const circle = (cx, cy, r) => (a) => `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
const rect = (x, y, w, h, rx = 0, t = "") => (a) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" ${t && `transform="${t}"`} ${a}/>`;
const path = (d) => (a) => `<path d="${d}" ${a}/>`;
const ellipse = (cx, cy, rx, ry) => (a) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${a}/>`;
// A in colour 1, B in colour 2, and B∩A in the overlap colour.
function ov(A, B, c1, c2, o) {
  const id = "m" + uid++;
  return `<defs><mask id="${id}"><rect x="-300" y="-300" width="600" height="600" fill="#000"/>${A('fill="#fff"')}</mask></defs>${A(`fill="${c1}"`)}${B(`fill="${c2}"`)}${B(`fill="${o}" mask="url(#${id})"`)}`;
}
const rad = (d) => (d * Math.PI) / 180;
const beam = (x, y, ang, spread, len) => {
  const p = (a) => `${x + Math.cos(rad(a)) * len},${y - Math.sin(rad(a)) * len}`;
  return path(`M${x},${y} L${p(ang + spread / 2)} L${p(ang - spread / 2)} Z`);
};

const ideas = [
  ["Marquise cut", "two spotlights; their overlap is the marquise gem shape", CREAM, () =>
    ov(circle(-30, 0, 56), circle(30, 0, 56), sunset.c, sunset.b, sunset.o)],

  ["Marquise eye", "the gem shape as an eye, a sun rising over it", CREAM, () =>
    ov(path("M-82,0 A100,100 0 0 1 82,0 A100,100 0 0 1 -82,0 Z"), circle(0, -30, 36), berry.c, berry.b, berry.o)],

  ["Crossing searchlights", "premiere night; two beams cross into an M-ish peak", DARK, () =>
    ov(beam(-56, 86, 62, 26, 160), beam(56, 86, 118, 26, 160), dusk.c, dusk.b, dusk.o)],

  ["Spotlight on stage", "a single beam hits the floor", CREAM, () =>
    `<rect x="-14" y="-92" width="28" height="14" rx="4" fill="${INK}"/>` +
    ov(ellipse(0, 58, 84, 20), path("M-10,-78 L10,-78 L58,58 L-58,58 Z"), lagoon.c, lagoon.b, lagoon.o)],

  ["Curtain call", "stage curtains frame the lit screen", CREAM, () =>
    `<rect x="-84" y="-72" width="168" height="144" rx="10" fill="${sunset.b}"/>` +
    `<path d="M-84,-60 H-8 C-14,0 -40,40 -84,52 Z" fill="${sunset.c}"/><path d="M84,-60 H8 C14,0 40,40 84,52 Z" fill="${sunset.c}"/>` +
    `<rect x="-84" y="-72" width="168" height="18" rx="6" fill="${sunset.o}"/>`],

  ["Audience", "three heads in front of the screen; overlap where they block it", CREAM, () => {
    const screen = rect(-88, -72, 176, 100, 10), id = "m" + uid++;
    const heads = [circle(-50, 46, 26), circle(0, 38, 29), circle(50, 46, 26)];
    return `<defs><mask id="${id}"><rect x="-300" y="-300" width="600" height="600" fill="#000"/>${screen('fill="#fff"')}</mask></defs>${screen(`fill="${candy.b}"`)}` +
      heads.map((h) => h(`fill="${candy.c}"`) + h(`fill="${candy.o}" mask="url(#${id})"`)).join("");
  }],

  ["Ticket", "admit one; two-tone stub with perforation", CREAM, () => {
    const id = "m" + uid++;
    const notches = `<circle cx="-88" cy="0" r="16" fill="#000"/><circle cx="88" cy="0" r="16" fill="#000"/><circle cx="34" cy="-50" r="9" fill="#000"/><circle cx="34" cy="50" r="9" fill="#000"/>`;
    const perf = [-30, -15, 0, 15, 30].map((y) => `<circle cx="34" cy="${y}" r="3.2" fill="#000"/>`).join("");
    return `<defs><mask id="${id}"><rect x="-88" y="-50" width="176" height="100" rx="8" fill="#fff"/>${notches}${perf}</mask></defs>
      <g mask="url(#${id})"><rect x="-88" y="-50" width="122" height="100" fill="${berry.c}"/><rect x="34" y="-50" width="54" height="100" fill="${berry.b}"/>
      <circle cx="-26" cy="0" r="24" fill="${berry.b}"/><path d="M-26,-24 A24,24 0 0 1 -26,24 Z" fill="${berry.o}"/></g>`;
  }],

  ["Two reels", "the reels on top of a projector, overlapping", CREAM, () => {
    const holes = (cx, cy, r, n) => Array.from({ length: n }, (_, i) => {
      const a = rad(i * (360 / n) - 90);
      return `<circle cx="${cx + Math.cos(a) * r * 0.55}" cy="${cy + Math.sin(a) * r * 0.55}" r="${r * 0.19}" fill="${CREAM}"/>`;
    }).join("") + `<circle cx="${cx}" cy="${cy}" r="${r * 0.1}" fill="${CREAM}"/>`;
    return ov(circle(-24, -10, 58), circle(46, 34, 42), dusk.c, dusk.b, dusk.o) + holes(-24, -10, 58, 5) + holes(46, 34, 42, 5);
  }],

  ["Marquee M", "the M spelled in bulbs", DARK, () => {
    const rows = ["X...X", "XX.XX", "X.X.X", "X...X", "X...X"];
    return `<rect x="-90" y="-90" width="180" height="180" rx="22" fill="${dusk.c}"/>` +
      rows.flatMap((r, y) => [...r].map((ch, x) => ch === "X" ? `<circle cx="${(x - 2) * 34}" cy="${(y - 2) * 34}" r="11" fill="${(x + y) % 2 ? dusk.b : dusk.o}"/>` : "")).join("");
  }],

  ["Aperture", "the lens iris, light through the middle", DARK, () => {
    const id = "m" + uid++, hex = (i, r) => [Math.cos(rad(60 * i)) * r, Math.sin(rad(60 * i)) * r];
    const lines = Array.from({ length: 6 }, (_, i) => {
      const [x1, y1] = hex(i, 34), [x2, y2] = hex(i + 1, 34), dx = x2 - x1, dy = y2 - y1;
      return `<line x1="${x1}" y1="${y1}" x2="${x1 + dx * 5}" y2="${y1 + dy * 5}" stroke="${DARK}" stroke-width="5"/>`;
    }).join("");
    const hx = Array.from({ length: 6 }, (_, i) => hex(i, 34).join(",")).join(" ");
    return `<defs><mask id="${id}"><circle r="86" fill="#fff"/></mask></defs><circle r="86" fill="${sunset.c}"/><g mask="url(#${id})">${lines}</g><polygon points="${hx}" fill="${sunset.b}"/>`;
  }],

  ["Film frames", "three frames in a row; overlaps are the cuts", CREAM, () =>
    ov(rect(-92, -36, 76, 72, 12), rect(-38, -36, 76, 72, 12), candy.c, candy.b, candy.o) +
    ov(rect(-38, -36, 76, 72, 12), rect(16, -36, 76, 72, 12), candy.b, candy.c, candy.o).replace(/<rect[^>]*fill="#ffd166"\/>/, "")],

  ["Clapper", "slate with the top arm lifted", CREAM, () => {
    const arm = rect(-80, -68, 160, 26, 5, "rotate(-14 -80 -42)");
    const stripes = [-56, -16, 24, 64].map((x) => `<path d="M${x},-68 h16 l-14,26 h-16 Z" fill="${CREAM}" transform="rotate(-14 -80 -42)"/>`).join("");
    return ov(rect(-80, -44, 160, 116, 10), arm, INK, sunset.b, sunset.o) + stripes;
  }],
];

document.getElementById("ideas").innerHTML = ideas.map(([name, note, bg, draw]) =>
  `<div class="card"><div class="art" style="background:${bg}"><svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">${draw()}</svg></div><div class="meta"><b>${name}</b><br>${note}</div></div>`).join("");
</script>
</body>
</html>

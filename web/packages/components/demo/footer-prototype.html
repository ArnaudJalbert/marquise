<!doctype html>
<!-- Throwaway prototype of the agreed compact footer, in the existing minimalist browsing layout. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marquise footer prototype</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--foreground, #111); font: 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, summary { font: inherit; color: inherit; }
    button, summary, a { touch-action: manipulation; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--foreground, #111); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .site { max-width: 1024px; margin: auto; padding: 0 20px; }
    .skip { position: absolute; left: 16px; top: -100px; }
    .skip:focus { top: 8px; z-index: 10; background: var(--background, #fff); padding: 12px; }
    .header { display: flex; gap: 28px; align-items: center; min-height: 76px; border-bottom: 1px solid var(--border, #ddd); margin-bottom: 24px; }
    .wordmark { font-size: 20px; letter-spacing: -.6px; margin-right: auto; }
    .primary { display: flex; gap: 24px; }
    .primary a, .footer a { display: inline-flex; align-items: center; min-height: 44px; }
    [aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }
    .info { position: relative; }
    .info > button { min-height: 44px; padding: 0 0 0 24px; border: 0; border-left: 1px solid var(--border, #ddd); background: transparent; }
    .info-panel { position: absolute; z-index: 5; right: 0; top: 48px; min-width: 176px; padding: 8px; border: 1px solid var(--border, #ddd); background: var(--popover, #fff); box-shadow: 0 4px 12px #0001; }
    .info-panel a { display: flex; min-height: 44px; align-items: center; padding: 0 12px; }
    .info-panel a:hover { background: var(--secondary, #f3f3f3); }
    main { min-height: 380px; }
    h1 { font-size: 26px; line-height: 1.2; font-weight: 500; margin: 0 0 20px; }
    h2 { font-size: 17px; line-height: 1.4; font-weight: 500; margin: 28px 0 8px; }
    p { margin: 0 0 16px; }
    .description { margin-bottom: 20px; }
    .description summary { cursor: pointer; width: fit-content; }
    .description p { margin-top: 10px; max-width: 600px; }
    .filters { display: grid; grid-template-columns: 1fr 175px 175px; gap: 12px; }
    .filters label { display: grid; gap: 4px; }
    input { min-width: 0; width: 100%; min-height: 44px; padding: 8px 12px; background: transparent; border: 1px solid var(--border, #ddd); border-radius: 3px; }
    .shortcuts { display: flex; gap: 8px; margin: 12px 0 24px; }
    .shortcuts button { min-height: 44px; border: 1px solid var(--border, #ddd); padding: 8px 12px; background: transparent; border-radius: 3px; }
    .shortcuts [aria-pressed="true"] { background: var(--secondary, #e2e2e2); box-shadow: inset 0 -2px var(--foreground, #111); }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--secondary, #eee); }
    .film-title { font-weight: 500; font-size: 14px; margin: 8px 0 2px; }
    .muted { color: var(--muted-foreground, #666); }
    .showtime { display: inline-block; margin-top: 6px; font-size: 12px; }
    .sample-end { padding-top: 24px; color: var(--muted-foreground, #666); }
    .article { max-width: 640px; margin: 36px 0 64px; font-size: 15px; line-height: 1.7; }
    .article a { text-decoration: underline; text-underline-offset: 3px; }
    .article ul { padding-left: 20px; }
    .article li { margin-bottom: 8px; }
    .eyebrow { font-size: 12px; color: var(--muted-foreground, #666); margin-bottom: 8px; }
    .placeholder { border-left: 2px solid var(--border, #ccc); padding-left: 18px; }
    .footer { display: flex; align-items: center; gap: 20px; margin-top: 48px; padding: 16px 0; border-top: 1px solid var(--border, #ddd); }
    .footer-name { font-weight: 500; margin-right: auto; }
    .footer nav { display: flex; flex-wrap: wrap; gap: 0 22px; }
    .review { padding: 12px 0 24px; border-top: 1px solid var(--border, #ddd); color: var(--muted-foreground, #666); font-size: 11px; }
    .review output { font: inherit; }
    .directory { list-style: none; padding: 0; }
    .directory a { display: block; padding: 14px 0; border-bottom: 1px solid var(--border, #ddd); text-decoration: underline; }
    @media (max-width: 639px) {
      .site { padding: 0 16px; }
      .header { flex-wrap: wrap; gap: 0; padding: 14px 0 0; }
      .wordmark { order: 0; }
      .info { order: 1; }
      .primary { order: 2; width: 100%; gap: 24px; margin-top: 6px; }
      .primary a { padding: 4px 0 12px; }
      .filters { grid-template-columns: 1fr 1fr; gap: 8px; }
      .filters label:first-child { grid-column: 1 / -1; }
      .grid { grid-template-columns: 1fr 1fr; }
      .footer { align-items: flex-start; flex-direction: column; gap: 0; }
      .footer-name { padding: 4px 0; }
      .footer nav { gap: 0 24px; }
      .article { margin-top: 28px; }
    }
  </style>
</head>
<body>
<div class="site">
  <a class="skip" href="#main">Skip to content</a>
  <header class="header">
    <a class="wordmark" href="#/">Marquise</a>
    <nav class="primary" aria-label="Main navigation">
      <a href="#/" data-section="screenings">Screenings</a>
      <a href="#/movies" data-section="movies">Movies</a>
      <a href="#/cinemas" data-section="cinemas">Cinemas</a>
    </nav>
    <div class="info">
      <button id="info-toggle" type="button" aria-expanded="false" aria-controls="info-panel">Info</button>
      <nav id="info-panel" class="info-panel" aria-label="Information" hidden></nav>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footer">
    <span class="footer-name">Marquise</span>
    <nav id="footer-links" aria-label="Footer"></nav>
  </footer>
  <aside class="review" aria-label="Prototype review state">
    Prototype · Sample listings · <output id="review-state" aria-live="polite"></output>
  </aside>
</div>
<template id="dune-poster"><img src="public/posters/dune.jpg" alt="Dune poster"></template>
<template id="perfect-days-poster"><img src="public/posters/perfect-days.jpg" alt="Perfect Days poster"></template>
<template id="past-lives-poster"><img src="public/posters/past-lives.jpg" alt="Past Lives poster"></template>
<template id="the-holdovers-poster"><img src="public/posters/the-holdovers.jpg" alt="The Holdovers poster"></template>
<template id="about">
  <article class="article">
    <h1>About Marquise</h1>
    <p>Marquise brings Montréal cinema showtimes together so you can find a film, choose a screening, and book with the cinema.</p>
    <h2>Find a screening</h2>
    <p>Browse Screenings by date, time, cinema, and language. Movies lets you search the film catalogue. Cinemas lets you start with a venue.</p>
    <h2>Coverage and showtimes</h2>
    <p>Marquise gathers listings from cinema websites. Coverage depends on the listings available from each source. A film in the catalogue may not have an upcoming screening.</p>
    <p>Schedules can change. Confirm the time, language, and availability on the cinema's website before you go.</p>
    <h2>Booking with cinemas</h2>
    <p>Booking links take you to the cinema or its ticket provider. Marquise does not sell tickets. For booking changes or refunds, contact the cinema.</p>
    <h2>Sources and credits</h2>
    <p>Showtimes come from the listed cinemas. Film metadata and images use <a href="https://www.themoviedb.org/">The Movie Database</a>.</p>
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p>Found a listing that needs correcting? <a href="#/contact">Contact Marquise</a>.</p>
  </article>
</template>
<template id="contact">
  <article class="article">
    <h1>Contact</h1>
    <p>Send questions about Marquise or report an incorrect listing by email.</p>
    <div class="placeholder"><p class="eyebrow">Prototype contact address. Not a working inbox.</p><p><a href="mailto:contact@marquise.example">contact@marquise.example</a></p></div>
    <h2>Report an incorrect showtime</h2>
    <p>Include the film title, cinema, date, time, and language. A link to the listing or the cinema's schedule helps us check it.</p>
    <h2>Tickets and bookings</h2>
    <p>For payment questions, booking changes, accessibility arrangements, or refunds, contact the cinema or the ticket provider directly.</p>
    <p>We cannot change cinema bookings or confirm ticket availability.</p>
  </article>
</template>
<template id="terms">
  <article class="article">
    <h1>Terms of service</h1>
    <div class="placeholder"><p class="eyebrow">Prototype placeholder</p><p>This page shows where Marquise's terms of service will appear. It does not contain published terms.</p></div>
    <h2>Using Marquise</h2><p class="muted">Terms content will be added here.</p>
    <h2>Showtime information and booking links</h2><p class="muted">Terms content will be added here.</p>
    <h2>Using the API</h2><p class="muted">Terms content will be added here.</p>
    <p>Questions? <a href="#/contact">Contact Marquise</a>.</p>
  </article>
</template>
<template id="privacy">
  <article class="article">
    <h1>Privacy</h1>
    <div class="placeholder"><p class="eyebrow">Prototype placeholder</p><p>This page shows where Marquise's privacy information will appear. It does not describe current data collection practices.</p></div>
    <h2>Information collected</h2><p class="muted">Privacy information will be added here.</p>
    <h2>Cookies and storage</h2><p class="muted">Privacy information will be added here.</p>
    <h2>Contact about privacy</h2><p>For privacy questions, <a href="#/contact">contact Marquise</a>.</p>
  </article>
</template>
<script>
  const destinations = [
    ["About", "#/about"],
    ["API docs", "https://marquise-api.fly.dev/docs"],
    ["Contact", "#/contact"],
    ["Terms", "#/terms"],
    ["Privacy", "#/privacy"]
  ];
  function poster(name) {
    return document.getElementById(`${name}-poster`).content.querySelector("img").getAttribute("src");
  }
  const films = [
    { title: "Dune", director: "Denis Villeneuve", year: "2021", image: poster("dune"), cinema: "Cinéma du Parc", time: "18:30" },
    { title: "Perfect Days", director: "Wim Wenders", year: "2023", image: poster("perfect-days"), cinema: "Cinéma Moderne", time: "19:00" },
    { title: "Past Lives", director: "Celine Song", year: "2023", image: poster("past-lives"), cinema: "Cinéma Beaubien", time: "19:15" },
    { title: "The Holdovers", director: "Alexander Payne", year: "2023", image: poster("the-holdovers"), cinema: "Cinéma du Musée", time: "20:00" }
  ];
  const main = document.querySelector("main");
  document.querySelector(".skip").addEventListener("click", event => {
    event.preventDefault();
    main.focus();
    main.scrollIntoView();
  });
  const toggle = document.querySelector("#info-toggle");
  const panel = document.querySelector("#info-panel");
  function closeInfo(restoreFocus = false) {
    panel.hidden = true;
    toggle.setAttribute("aria-expanded", "false");
    if (restoreFocus) toggle.focus();
  }
  for (const id of ["info-panel", "footer-links"]) {
    document.getElementById(id).innerHTML = destinations.map(([label, href]) =>
      `<a href="${href}">${label}${href.startsWith("https:") ? ' <span aria-hidden="true">&nbsp;↗</span><span class="external-label" hidden> (external website)</span>' : ""}</a>`
    ).join("");
    document.querySelectorAll(`#${id} a[href^="https:"]`).forEach(link => link.setAttribute("aria-label", "API docs, external website"));
  }
  toggle.addEventListener("click", () => {
    const opening = panel.hidden;
    panel.hidden = !opening;
    toggle.setAttribute("aria-expanded", String(opening));
  });
  document.addEventListener("click", event => {
    if (!event.target.closest(".info")) closeInfo();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !panel.hidden) closeInfo(true);
  });
  document.querySelector(".info").addEventListener("focusout", event => {
    if (!event.currentTarget.contains(event.relatedTarget)) closeInfo();
  });
  function render(moveFocus = false) {
    const route = location.hash.slice(2).split("?")[0] || "screenings";
    const page = ["about", "contact", "terms", "privacy"].includes(route);
    closeInfo();
    document.querySelectorAll("nav a").forEach(link => {
      const active = link.dataset.section === route || link.getAttribute("href") === `#/${route}`;
      if (active) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    const title = route === "terms" ? "Terms of service" : route.charAt(0).toUpperCase() + route.slice(1);
    document.title = `${title} · Marquise footer prototype`;
    document.getElementById("review-state").value = `${title} · ${page ? "Draft information page" : "Fictional showtimes"}`;
    if (page) {
      main.replaceChildren(document.getElementById(route).content.cloneNode(true));
    } else if (route === "cinemas") {
      main.innerHTML = '<h1>Cinemas</h1><p class="muted">Sample venues for reviewing navigation.</p><ul class="directory">' + films.map(film => `<li><a href="#/cinema?name=${encodeURIComponent(film.cinema)}">${film.cinema}</a></li>`).join("") + '</ul>';
    } else {
      const isMovies = route === "movies";
      const cinema = route === "cinema" ? new URLSearchParams(location.hash.split("?")[1]).get("name") : null;
      main.innerHTML = `${cinema ? '<h1 id="cinema-title"></h1>' : ""}<details class="description"><summary>About this section</summary><p>${isMovies ? 'Search the film catalogue independently of screening dates.' : 'Find movies with showtimes, then choose a date or search by title.'}</p></details>
      <div class="filters"><label>${isMovies ? "Search movies" : "Search titles"}<input id="search" type="search" placeholder="${isMovies ? "Search the catalogue" : "Film title"}"></label>${isMovies ? "" : '<label>From<input id="start" type="date" value="2026-11-01"></label><label>To<input id="end" type="date" value="2026-11-01"></label>'}</div>
      ${isMovies ? '<div style="height:24px"></div>' : '<div class="shortcuts"><button type="button" data-day="2026-11-01" aria-pressed="true">Today</button><button type="button" data-day="2026-11-02" aria-pressed="false">Tomorrow</button></div>'}
      <div class="grid" id="films"></div><p class="sample-end">End of sample listings.</p>`;
      if (cinema) document.getElementById("cinema-title").textContent = cinema;
      const drawFilms = () => {
        const query = document.getElementById("search").value.toLowerCase();
        const visible = films.filter(film => film.title.toLowerCase().includes(query) && (!cinema || film.cinema === cinema));
        document.getElementById("films").innerHTML = visible.length ? visible.map(film => `<article><img class="poster" src="${film.image}" alt="${film.title} poster"><h2 class="film-title">${film.title}</h2><div class="muted">${film.year} · ${film.director}</div>${isMovies ? "" : `<span class="showtime">${film.cinema} · ${film.time}</span>`}</article>`).join("") : '<p>No sample movies match.</p>';
      };
      drawFilms();
      document.getElementById("search").addEventListener("input", drawFilms);
      document.querySelectorAll("[data-day]").forEach(button => button.addEventListener("click", () => {
        document.getElementById("start").value = button.dataset.day;
        document.getElementById("end").value = button.dataset.day;
        document.querySelectorAll("[data-day]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        document.getElementById("review-state").value = `Screenings · Fictional showtimes · Date: ${button.dataset.day}`;
      }));
    }
    if (moveFocus) {
      window.scrollTo(0, 0);
      main.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", () => render(true));
  render();
</script>
</body>
</html>

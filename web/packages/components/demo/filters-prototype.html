<!doctype html>
<!-- PROTOTYPE, throwaway. Round 2: dedicated search field + generic "Add filter" chips next to the date control. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --indigo:#6366f1; --deep:#4f46e5; --ink:var(--foreground,#18181b); --mute:var(--muted-foreground,#71717a); --line:var(--border,#e4e4e7); --bg:var(--background,#fff); }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); padding:4px 0 8px; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  svg.i { width:15px; height:15px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #stage { position:relative; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .date { display:flex; align-items:center; gap:10px; }
  .date .t { font-size:28px; font-weight:700; letter-spacing:-.025em; }
  .step { border:1px solid var(--line); background:transparent; border-radius:999px; width:32px; height:32px; display:grid; place-items:center; color:var(--mute); }
  .step:hover { color:var(--ink); border-color:color-mix(in srgb, var(--ink) 40%, transparent); }
  .date small { color:var(--mute); font-size:13px; margin-left:2px; }

  .search { flex:0 1 320px; display:flex; align-items:center; gap:8px; height:38px; padding:0 8px 0 12px; border:1px solid var(--line); border-radius:10px; color:var(--mute); transition:border-color .15s, box-shadow .15s; }
  .search:focus-within { border-color:var(--deep); box-shadow:0 0 0 3px #6366f12e; color:var(--ink); }
  .search input { flex:1; min-width:0; border:0; outline:none; background:none; color:var(--ink); }
  .search input::placeholder { color:var(--mute); }
  .kbd { font:11px ui-monospace,monospace; color:var(--mute); border:1px solid var(--line); border-radius:5px; padding:1px 6px; }
  .search .clr { border:0; background:none; color:var(--mute); display:grid; place-items:center; padding:4px; border-radius:6px; }

  .fl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; min-height:32px; }
  .add { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px 0 10px; border:1px dashed color-mix(in srgb, var(--mute) 60%, transparent); background:transparent; border-radius:8px; color:var(--mute); font-size:13px; }
  .add:hover, .add.open { color:var(--deep); border-color:var(--deep); border-style:solid; background:#6366f10f; }
  .chip { display:inline-flex; align-items:stretch; height:30px; border:1px solid color-mix(in srgb, var(--deep) 45%, var(--line)); background:#6366f10f; border-radius:8px; font-size:13px; overflow:hidden; }
  .chip > * { display:flex; align-items:center; }
  .chip .k { gap:6px; padding:0 8px 0 10px; color:var(--deep); }
  .chip .op { color:var(--mute); padding-right:6px; }
  .chip .v { border:0; background:none; font-weight:600; padding:0 10px 0 0; max-width:240px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; line-height:28px; }
  .chip .v:hover { color:var(--deep); }
  .chip .x { border:0; border-left:1px solid color-mix(in srgb, var(--deep) 30%, var(--line)); background:none; color:var(--mute); padding:0 8px; }
  .chip .x:hover { color:var(--deep); background:#6366f11f; }
  .clear { border:0; background:none; color:var(--mute); font-size:13px; padding:4px 6px; border-radius:6px; }
  .clear:hover { color:var(--ink); }

  #pop { position:absolute; z-index:5; width:300px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 2px #0001, 0 16px 40px #0003; padding:6px; display:none; }
  #pop.on { display:block; animation:in .12s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(-4px); } }
  .ph { display:flex; align-items:center; gap:6px; padding:6px 8px 8px; font-size:12px; color:var(--mute); }
  .ph .back { border:0; background:none; color:var(--mute); padding:2px; border-radius:6px; display:grid; place-items:center; }
  .ph .back:hover { color:var(--ink); }
  .pin { display:flex; align-items:center; gap:8px; margin:0 2px 6px; padding:0 10px; height:34px; border:1px solid var(--line); border-radius:8px; color:var(--mute); }
  .pin input { flex:1; border:0; outline:none; background:none; font-size:13px; }
  .list { max-height:260px; overflow:auto; }
  .it { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:8px 10px; border-radius:8px; text-align:left; }
  .it:hover:not(:disabled) { background:#6366f114; }
  .it .ic { color:var(--mute); }
  .it .lab { flex:1; min-width:0; }
  .it .lab small { display:block; color:var(--mute); font-size:12px; }
  .it .n { color:var(--mute); font-size:12px; font-variant-numeric:tabular-nums; }
  .it .ck { width:16px; color:var(--deep); visibility:hidden; }
  .it.on .ck { visibility:visible; }
  .it.on .lab { font-weight:600; }
  .it:disabled { opacity:.38; cursor:default; }
  .sep { height:1px; background:var(--line); margin:6px 4px; }
  .foot { display:flex; justify-content:space-between; padding:4px 6px 2px; }
  .foot button { border:0; background:none; font-size:12px; color:var(--mute); padding:4px 6px; border-radius:6px; }
  .foot button:hover { color:var(--ink); }

  .sum { color:var(--mute); font-size:13px; margin:18px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:12px; }
  .poster { aspect-ratio:2/3; border-radius:8px; padding:8px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff; font-weight:650; font-size:13px; line-height:1.2; position:relative; overflow:hidden; }
  .poster small { font-weight:500; opacity:.85; font-size:11px; margin-top:3px; }
  .poster::before { content:""; position:absolute; inset:0; background:linear-gradient(transparent 45%, #0009); }
  .poster > * { position:relative; }
  .none { color:var(--mute); padding:30px 0; grid-column:1/-1; }
  #state { margin-top:16px; font:12px/1.5 ui-monospace,monospace; border:1px dashed var(--line); border-radius:8px; padding:8px 12px; white-space:pre-wrap; color:var(--mute); }
</style>
</head>
<body>
<div id="stage"><div id="ui"></div><div class="sum" id="sum"></div><div class="grid" id="grid"></div><div id="pop"></div></div>
<div id="state"></div>
<script>
const ICON = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', check: '<path d="M20 6 9 17l-5-5"/>',
  back: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  cin: '<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>',
  lang: '<path d="M4 5h8M8 3v2M6 5c0 4 3 7 6 8M10 5c0 4-3 7-6 8M13 20l4-9 4 9M14.5 17h5"/>',
  time: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;

const CINEMAS = ["Cinéma du Parc","Cinémathèque québécoise","Cinéma Moderne","Cinéma Public","Cinéma Beaubien","Cinéma Outremont","Cinéma Cinéma","Cinéstarz Côte-des-Neiges","Cineplex Forum","Cineplex Quartier Latin","Scotiabank Montréal","Cineplex Odeon Brossard"];
const LANGS = { orig: { label: "Original version", hint: "VO · VOA · VOF", codes: ["VO","VOA","VOF"] }, sub: { label: "Subtitled", hint: "VOSTF · VOSTA", codes: ["VOSTF","VOSTA"] }, dub: { label: "French dub", hint: "VF", codes: ["VF"] } };
const TIMES = { mat: { label: "Matinée", hint: "Before 5 PM", t: (h) => h < 17 }, eve: { label: "Evening", hint: "5 to 9 PM", t: (h) => h >= 17 && h < 21 }, late: { label: "Late", hint: "9 PM and later", t: (h) => h >= 21 } };
const CODES = ["VO","VOA","VOF","VOSTF","VOSTA","VF"];
const FILMS = ["Paris, Texas","In the Mood for Love","Perfect Days","Stalker","La Haine","Tampopo","Aftersun","Mon oncle","Close-Up","Chungking Express","Le Samouraï","Portrait of a Lady on Fire","Monsieur Lazhar","Incendies","Mommy","Past Lives","Anatomy of a Fall","The Zone of Interest"];
const HOURS = [13, 14.5, 16, 18, 19.5, 21, 22.5];
const SC = [];
FILMS.forEach((_, f) => { for (let k = 0; k < 2 + (f % 4); k++) SC.push({ f, c: (f * 5 + k * 7) % 12 < 9 ? (f * 5 + k * 7) % 12 : (f + k) % 6, h: HOURS[(f * 3 + k * 2) % 7], code: CODES[(f * 2 + k) % 6] }); });
const langOf = (code) => Object.keys(LANGS).find((k) => LANGS[k].codes.includes(code));
const timeOf = (h) => Object.keys(TIMES).find((k) => TIMES[k].t(h));

const FACETS = {
  cin: { name: "Cinema", icon: "cin", of: (s) => s.c, opts: () => CINEMAS.map((n, i) => [i, n, ""]), hint: "12 cinemas" },
  lang: { name: "Language", icon: "lang", of: (s) => langOf(s.code), opts: () => Object.entries(LANGS).map(([k, d]) => [k, d.label, d.hint]), hint: "Original, subtitled, dubbed" },
  time: { name: "Time", icon: "time", of: (s) => timeOf(s.h), opts: () => Object.entries(TIMES).map(([k, d]) => [k, d.label, d.hint]), hint: "Matinée, evening, late" },
};
const F = { cin: [], lang: [], time: [], title: "" }; // arrays keep the order you picked things in
const UI = { pop: null, facet: null, q: "" };      // pop: "add" | facet key; facet: open option list

function ok(s, skip) {
  for (const k in FACETS) if (k !== skip && F[k].length && !F[k].includes(FACETS[k].of(s))) return false;
  return !F.title || FILMS[s.f].toLowerCase().includes(F.title.toLowerCase());
}
function counts(k) { const m = {}; SC.forEach((s) => { if (ok(s, k)) { const v = FACETS[k].of(s); m[v] = (m[v] ?? 0) + 1; } }); return m; }
const active = () => Object.keys(FACETS).filter((k) => F[k].length);
const label = (k, v) => FACETS[k].opts().find((o) => o[0] === v)[1];
function value(k) { const a = F[k]; return a.length <= 2 ? a.map((v) => label(k, v)).join(", ") : `${label(k, a[0])} +${a.length - 1}`; }

function head() {
  const n = SC.filter((s) => ok(s)).length;
  return `<div class="top">
    <div class="date"><button class="step">${ic("back")}</button><span class="t">Today</span><button class="step">${ic("right")}</button><small>Mon Nov 2</small></div>
    <label class="search">${ic("search")}<input id="sq" placeholder="Search movies" value="${F.title.replace(/"/g, "&quot;")}" autocomplete="off">${F.title ? `<button class="clr" id="sclr">${ic("x")}</button>` : `<span class="kbd">/</span>`}</label>
  </div>
  <div class="fl">
    ${active().map((k) => `<span class="chip" data-anchor="${k}"><span class="k">${ic(FACETS[k].icon)}${FACETS[k].name}</span><span class="op">${F[k].length > 1 ? "is any of" : "is"}</span><button class="v" data-edit="${k}">${value(k)}</button><button class="x" data-clear="${k}" title="Remove">${ic("x")}</button></span>`).join("")}
    ${active().length < 3 ? `<button class="add ${UI.pop === "add" ? "open" : ""}" data-anchor="add">${ic("plus")}${active().length ? "Filter" : "Add filter"}</button>` : ""}
    ${active().length > 1 ? `<button class="clear" id="ca">Clear all</button>` : ""}
  </div>`;
}
function popHtml() {
  if (!UI.facet) {
    return `<div class="ph">Filter by</div>` + Object.entries(FACETS).filter(([k]) => !F[k].length).map(([k, f]) =>
      `<button class="it" data-pick="${k}"><span class="ic">${ic(f.icon)}</span><span class="lab">${f.name}<small>${f.hint}</small></span><span class="ic">${ic("right")}</span></button>`).join("");
  }
  const k = UI.facet, f = FACETS[k], c = counts(k);
  let opts = f.opts();
  if (k === "cin") opts = opts.sort((a, b) => (F.cin.includes(b[0]) - F.cin.includes(a[0])) || (c[b[0]] ?? 0) - (c[a[0]] ?? 0)).filter((o) => o[1].toLowerCase().includes(UI.q.toLowerCase()));
  return `<div class="ph">${UI.pop === "add" ? `<button class="back" data-back>${ic("back")}</button>` : ""}${ic(f.icon)}${f.name}</div>
    ${k === "cin" ? `<label class="pin">${ic("search")}<input id="pq" placeholder="Find a cinema" value="${UI.q}"></label>` : ""}
    <div class="list">${opts.map(([v, l, h]) => { const on = F[k].includes(v), n = c[v] ?? 0;
      return `<button class="it ${on ? "on" : ""}" data-v="${v}" ${!n && !on ? "disabled" : ""}><span class="ck">${ic("check")}</span><span class="lab">${l}${h ? `<small>${h}</small>` : ""}</span><span class="n">${n}</span></button>`; }).join("")}</div>
    ${F[k].length ? `<div class="sep"></div><div class="foot"><button data-only>Clear ${f.name.toLowerCase()}</button><button data-done>Done</button></div>` : ""}`;
}
function renderPop() {
  const pop = document.getElementById("pop"), a = UI.pop && document.querySelector(`[data-anchor="${UI.pop}"]`);
  if (!a) { pop.className = ""; return; }
  const st = document.getElementById("stage").getBoundingClientRect(), r = a.getBoundingClientRect();
  const wasOpen = pop.className === "on";
  pop.innerHTML = popHtml(); pop.className = "on"; if (wasOpen) pop.style.animation = "none";
  pop.style.left = Math.max(0, Math.min(r.left - st.left, st.width - 300)) + "px"; pop.style.top = r.bottom - st.top + 6 + "px";
  pop.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => { UI.facet = b.dataset.pick; UI.q = ""; renderPop(); });
  pop.querySelector("[data-back]")?.addEventListener("click", () => { UI.facet = null; renderPop(); });
  pop.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => {
    const k = UI.facet, v = k === "cin" ? +b.dataset.v : b.dataset.v;
    F[k] = F[k].includes(v) ? F[k].filter((x) => x !== v) : [...F[k], v];
    if (UI.pop === "add" && F[k].length) UI.pop = k; // the new chip now owns the popover
    render();
  });
  pop.querySelector("[data-only]")?.addEventListener("click", () => { F[UI.facet] = []; close(); });
  pop.querySelector("[data-done]")?.addEventListener("click", close);
  const pq = pop.querySelector("#pq");
  if (pq) { pq.oninput = () => { UI.q = pq.value; renderPop(); const n = document.getElementById("pq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }; }
}
function close() { UI.pop = null; UI.facet = null; UI.q = ""; render(); }
document.addEventListener("click", (e) => {
  if (!UI.pop || !document.contains(e.target) || e.target.closest("#pop") || e.target.closest("[data-anchor]")) return;
  close();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && UI.pop) close();
  if (e.key === "/" && document.activeElement?.tagName !== "INPUT") { e.preventDefault(); document.getElementById("sq").focus(); }
});

function render() {
  const ui = document.getElementById("ui"), had = document.activeElement?.id === "sq", pos = had ? document.activeElement.selectionStart : 0;
  ui.innerHTML = head();
  const sq = document.getElementById("sq");
  if (had) { sq.focus(); sq.setSelectionRange(pos, pos); }
  sq.oninput = () => { F.title = sq.value; render(); };
  document.getElementById("sclr")?.addEventListener("click", (e) => { e.preventDefault(); F.title = ""; render(); document.getElementById("sq").focus(); });
  ui.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => { const k = b.dataset.edit; if (UI.pop === k) return close(); UI.pop = k; UI.facet = k; UI.q = ""; render(); });
  ui.querySelector('[data-anchor="add"]')?.addEventListener("click", () => { if (UI.pop === "add") return close(); UI.pop = "add"; UI.facet = null; render(); });
  ui.querySelectorAll("[data-clear]").forEach((b) => b.onclick = () => { F[b.dataset.clear] = []; close(); });
  ui.querySelector("#ca")?.addEventListener("click", () => { for (const k in FACETS) F[k] = []; close(); });
  renderPop();
  const m = SC.filter((s) => ok(s)), by = {};
  m.forEach((s) => by[s.f] = (by[s.f] ?? 0) + 1);
  const fs = Object.keys(by).map(Number);
  document.getElementById("sum").textContent = `${fs.length} movie${fs.length === 1 ? "" : "s"} · ${m.length} screening${m.length === 1 ? "" : "s"} today`;
  document.getElementById("grid").innerHTML = fs.length ? fs.map((f) => `<div class="poster" style="background:linear-gradient(160deg, hsl(${f * 47 % 360} 45% 45%), hsl(${(f * 47 + 60) % 360} 40% 22%))"><span>${FILMS[f]}</span><small>${by[f]} screening${by[f] > 1 ? "s" : ""}</small></div>`).join("") : `<div class="none">No screenings match. Remove a filter or change the date.</div>`;
  document.getElementById("state").textContent = `search   ${F.title || "—"}\ncinema   ${F.cin.map((i) => CINEMAS[i]).join(", ") || "any"}\nlanguage ${F.lang.join(", ") || "any"}  →  codes ${F.lang.flatMap((k) => LANGS[k].codes).join(", ") || "all"}\ntime     ${F.time.join(", ") || "any"}\npopover  ${UI.pop ?? "closed"}${UI.facet ? " / " + UI.facet : ""}`;
}
// Start with a couple of filters applied so the chips are visible.
F.cin = [0, 2]; F.time = ["eve"];
render();
</script>
</body>
</html>

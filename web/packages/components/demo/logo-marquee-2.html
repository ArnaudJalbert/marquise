<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marquise logo ideas: corner marquee and blade sign</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); }
  body.standalone { background: #0b0d10; color: #f1f3f5; padding: 32px; --font-mono: ui-monospace, monospace; }
  h2 { font-size: 12px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; opacity: .7; margin: 28px 0 12px; }
  h2:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { border: 1px solid #35414d; border-radius: 12px; overflow: hidden; }
  .art { aspect-ratio: 1; display: grid; place-items: center; }
  .art svg { width: 76%; height: 76%; }
  .meta { padding: 8px 10px; font: 11px var(--font-mono); color: #c3ccd5; background: #222c36; }
  .meta b { color: #f1f3f5; font-weight: 600; }
  .small { display: flex; gap: 18px; align-items: end; flex-wrap: wrap; padding: 16px; border: 1px solid #35414d; border-radius: 12px; background: #faf6f0; }
</style>
</head>
<body>
<h2>Corner marquee</h2>
<div class="grid" id="corner"></div>
<h2>Blade + canopy, new silhouettes</h2>
<div class="grid" id="blade"></div>
<h2>Favourites at 32 / 16 px</h2>
<div class="small" id="small"></div>
<script>
if (window.self === window.top) document.body.classList.add("standalone");

const CREAM = "#faf6f0", INK = "#1d1a24", DARK = "#14181c";
const cherry = { c: "#d7263d", b: "#f4d35e", o: "#1b998b" };
const sunset = { c: "#ff7a59", b: "#ffc94a", o: "#e5386d" };
const dusk = { c: "#3d348b", b: "#f7b801", o: "#f35b04" };
const candy = { c: "#5e9cff", b: "#ffd166", o: "#06d6a0" };

let uid = 0;
const dots = (pts, r, fill) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join("");

// Corner marquee: two sign faces meeting at a point toward the viewer.
// Each face is drawn in local coords (0..W, 0..H) and skewed into place, so details follow the perspective.
const W = 88, RISE = 26, SKEW = (Math.atan(RISE / W) * 180) / Math.PI;
const face = (side, top, inner) => side === "L"
  ? `<g transform="translate(${-W} ${top}) skewY(${SKEW})">${inner}</g>`
  : `<g transform="translate(0 ${top + RISE}) skewY(${-SKEW})">${inner}</g>`;
const faces = (top, H, lf, rf, innerL = "", innerR = innerL) =>
  face("L", top, `<rect width="${W}" height="${H}" fill="${lf}"/>${innerL}`) +
  face("R", top, `<rect width="${W}" height="${H}" fill="${rf}"/>${innerR}`);
// A chevron band (cap or lit underside) following the faces.
const band = (top, h, fill) => faces(top, h, fill, fill);
const letters = (H, fill) => `<rect x="12" y="${H * 0.3 - 3}" width="58" height="6" rx="3" fill="${fill}"/><rect x="12" y="${H * 0.62 - 3}" width="42" height="6" rx="3" fill="${fill}"/>`;
const bulbRow = (y, fill, r = 3.6) => dots([10, 24, 38, 52, 66, 80].map((x) => [x, y]), r, fill);

// Prism version: the corner edge is nearest to you, so it is the tallest edge and the faces
// taper toward the ends. pt(side, u, v): u 0 = far end, 1 = corner; v 0 = top, 1 = bottom.
const prism = ({ end = 34, mid = 64, w = 88, y = 0 } = {}) => {
  const pt = (side, u, v) => {
    const x = (side === "L" ? -1 : 1) * w * (1 - u), h = end + (mid - end) * u;
    return [x, y - h / 2 + h * v];
  };
  const poly = (side, u0, u1, v0, v1, fill) =>
    `<polygon points="${[pt(side, u0, v0), pt(side, u1, v0), pt(side, u1, v1), pt(side, u0, v1)].map((p) => p.join(",")).join(" ")}" fill="${fill}"/>`;
  const both = (f) => f("L") + f("R");
  return {
    faces: (lf, rf, gap = 0) => poly("L", 0, 1, 0, 1, lf) + poly("R", 0, 1, 0, 1, rf).replace(/points="/, `transform="translate(${gap} 0)" points="`),
    // Band above (v < 0) or below (v > 1) the faces, following their edges.
    band: (v0, v1, fill) => both((sd) => poly(sd, 0, 1, v0, v1, fill)),
    rows: (fill) => both((sd) => poly(sd, 0.14, 0.86, 0.26, 0.38, fill) + poly(sd, 0.14, 0.6, 0.56, 0.68, fill)),
    bulbs: (v, fill, n = 6) => both((sd) => Array.from({ length: n }, (_, i) => {
      const u = (i + 0.5) / n, [x, yy] = pt(sd, u, v), r = (end + (mid - end) * u) * 0.075;
      return `<circle cx="${x}" cy="${yy}" r="${r}" fill="${fill}"/>`;
    }).join("")),
  };
};

const corner = [
  ["Before: flat faces", "same height everywhere, reads as an open book", CREAM, () => faces(-30, 40, cherry.c, cherry.o)],
  ["Prism", "corner edge tallest, faces taper away from you", CREAM, () => prism().faces(cherry.c, cherry.o)],
  ["Prism + lit underside", "a glowing band under the faces", CREAM, () => { const p = prism({ y: -6 }); return p.faces(cherry.c, cherry.o) + p.band(1, 1.18, cherry.b); }],
  ["Prism + cap", "cornice on top, light below", CREAM, () => { const p = prism({ y: -2 }); return p.band(-0.14, 0, INK) + p.faces(cherry.c, cherry.o) + p.band(1, 1.16, cherry.b); }],
  ["Prism + letters", "rows of changeable letters", CREAM, () => { const p = prism({ end: 40, mid: 72 }); return p.faces(cherry.c, cherry.o) + p.rows(CREAM); }],
  ["Prism + bulbs", "bulbs along both edges", DARK, () => { const p = prism({ end: 40, mid: 72 }); return p.faces(cherry.c, cherry.o) + p.bulbs(0.13, cherry.b) + p.bulbs(0.87, cherry.b); }],
  ["Steep", "stronger perspective, more dramatic", CREAM, () => prism({ end: 26, mid: 80 }).faces(cherry.c, cherry.o)],
  ["Dusk", "night palette, lit underside", DARK, () => { const p = prism({ y: -6 }); return p.faces(dusk.c, dusk.o) + p.band(1, 1.18, dusk.b); }],
  ["Sunset", "warmer", CREAM, () => { const p = prism({ y: -6 }); return p.faces(sunset.c, sunset.o) + p.band(1, 1.18, sunset.b); }],
  ["Mono", "one colour, faces split by a gap", CREAM, () => prism().faces(INK, INK, 5)],
];

// Blade + canopy variations.
function overlap(A, B, c1, c2, o) {
  const id = "m" + uid++;
  return `<defs><mask id="${id}"><rect x="-300" y="-300" width="600" height="600" fill="#000"/>${A('fill="#fff"')}</mask></defs>${A(`fill="${c1}"`)}${B(`fill="${c2}"`)}${B(`fill="${o}" mask="url(#${id})"`)}`;
}
const shape = (tag) => (a) => tag.replace("/>", ` ${a}/>`);

const blade = [
  ["Blade on corner", "the blade rising from the corner of the prism", CREAM, () => {
    const p = prism({ y: 30, end: 30, mid: 56 });
    return `<rect x="-13" y="-94" width="26" height="110" rx="4" fill="${cherry.b}"/>` + p.faces(cherry.c, cherry.o);
  }],
  ["Blade off-centre", "blade at the end of the canopy, like most real facades", CREAM, () =>
    overlap(shape(`<rect x="-86" y="14" width="172" height="40" rx="6"/>`), shape(`<rect x="38" y="-90" width="32" height="118" rx="6"/>`), sunset.c, sunset.b, sunset.o)],
  ["Pointed blade", "spire top, canopy flares toward you", CREAM, () =>
    overlap(shape(`<path d="M-74,16 H74 L90,54 H-90 Z"/>`), shape(`<path d="M-18,-58 L0,-92 L18,-58 V30 H-18 Z"/>`), dusk.c, dusk.b, dusk.o)],
  ["Arched blade", "round top, pill canopy", CREAM, () =>
    overlap(shape(`<rect x="-88" y="18" width="176" height="38" rx="19"/>`), shape(`<path d="M-20,34 V-70 A20,20 0 0 1 20,-70 V34 Z"/>`), candy.c, candy.b, candy.o)],
  ["Blade with letters", "stacked letter tiles, bulbs on the canopy", CREAM, () =>
    `<rect x="-20" y="-92" width="40" height="118" rx="6" fill="${cherry.c}"/>` +
    [-80, -58, -36, -14].map((y) => `<rect x="-9" y="${y}" width="18" height="16" rx="3" fill="${cherry.b}"/>`).join("") +
    `<rect x="-86" y="20" width="172" height="36" rx="6" fill="${cherry.o}"/>` + dots([-68, -46, -24, 24, 46, 68].map((x) => [x, 38]), 6, cherry.b)],
  ["Finial", "deco ball on top of the blade", CREAM, () =>
    `<circle cx="0" cy="-78" r="14" fill="${sunset.o}"/>` +
    overlap(shape(`<rect x="-86" y="16" width="172" height="40" rx="6"/>`), shape(`<rect x="-16" y="-60" width="32" height="92" rx="4"/>`), sunset.c, sunset.b, sunset.o)],
  ["Stepped blade", "the blade steps out in two widths", CREAM, () =>
    `<rect x="-12" y="-94" width="24" height="40" rx="4" fill="${dusk.o}"/><rect x="-22" y="-60" width="44" height="90" rx="6" fill="${dusk.b}"/>` +
    `<rect x="-86" y="22" width="172" height="36" rx="6" fill="${dusk.c}"/>`],
  ["Side blade", "blade hangs off the left, canopy runs right", CREAM, () =>
    overlap(shape(`<rect x="-60" y="-10" width="148" height="42" rx="6"/>`), shape(`<rect x="-88" y="-90" width="34" height="164" rx="6"/>`), cherry.c, cherry.b, cherry.o)],
];

const svg = (inner, size) => `<svg viewBox="-100 -100 200 200" ${size ? `width="${size}" height="${size}"` : ""} xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const cards = (list) => list.map(([name, note, bg, draw]) =>
  `<div class="card"><div class="art" style="background:${bg}">${svg(draw())}</div><div class="meta"><b>${name}</b><br>${note}</div></div>`).join("");
document.getElementById("corner").innerHTML = cards(corner);
document.getElementById("blade").innerHTML = cards(blade);
document.getElementById("small").innerHTML = [corner[1], corner[2], corner[3], corner[5], blade[0], blade[1]]
  .map(([, , , draw]) => [32, 16].map((s) => svg(draw(), s)).join("")).join("<span style='width:12px'></span>");
</script>
</body>
</html>

<!doctype html>
<!-- PROTOTYPE, throwaway. Question: on phones, does "‹ Today ›" in the sticky bar + a bottom-sheet brush feel right? -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --indigo:#6366f1; --deep:#4f46e5; --pink:#fde68a; --ink:var(--foreground,#18181b); --mute:var(--muted-foreground,#71717a); --line:var(--border,#e4e4e7); --bg:var(--background,#fff); }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); padding:4px 0 8px; }
  button { font:inherit; cursor:pointer; color:inherit; }
  .wrap { display:flex; gap:20px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  .side { width:250px; font-size:13px; color:var(--mute); }
  .side b { color:var(--ink); font-weight:600; }
  .side .seg { display:flex; width:max-content; margin:6px 0 14px; }
  #state { font:12px/1.5 ui-monospace,monospace; border:1px dashed var(--line); border-radius:8px; padding:8px 10px; white-space:pre-wrap; }
  .phone { width:375px; height:720px; border:10px solid #0a0a0a; border-radius:44px; overflow:hidden; position:relative; background:var(--bg); box-shadow:0 0 0 1px var(--line); }
  .scroll { height:100%; overflow:auto; scrollbar-width:none; }
  .brand { padding:18px 18px 6px; font-weight:800; letter-spacing:.14em; font-size:13px; }
  #bar { position:sticky; top:0; z-index:2; background:var(--bg); padding:10px 12px; border-bottom:1px solid var(--line); user-select:none; }
  #bar.compact { box-shadow:0 6px 16px #0002; }
  .tb { display:flex; align-items:center; gap:8px; }
  .step { border:1px solid var(--line); background:transparent; border-radius:999px; width:36px; height:36px; display:grid; place-items:center; color:var(--mute); flex:none; font-size:18px; }
  .step:disabled { opacity:.3; pointer-events:none; }
  .ttl { flex:1; border:0; background:none; text-align:left; padding:2px 4px; border-radius:10px; min-width:0; }
  .ttl .t { display:flex; align-items:center; gap:6px; font-weight:700; font-size:24px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ttl .t::after { content:"▾"; font-size:13px; color:var(--deep); }
  .ttl small { display:block; color:var(--mute); font-size:12px; }
  #bar.compact .ttl .t { font-size:17px; }
  #bar.compact .ttl small { display:none; }
  #bar.compact .step { width:30px; height:30px; font-size:15px; }
  .res { padding:4px 16px 60px; min-height:900px; }
  .res h4 { margin:18px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); }
  .res .f { display:flex; flex-direction:column; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .res .f small { color:var(--mute); font-size:12px; }
  .empty { text-align:center; padding:60px 10px; color:var(--mute); }
  .empty p { margin:0 0 14px; }
  .cta { border:0; background:var(--deep); color:#fff; border-radius:999px; padding:10px 18px; font-weight:600; }
  .scrim { position:absolute; inset:0; background:#0006; z-index:5; opacity:0; pointer-events:none; transition:opacity .2s; }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:6; background:var(--bg); border-radius:20px 20px 0 0; padding:8px 16px 22px; transform:translateY(105%); transition:transform .25s cubic-bezier(.2,.8,.2,1); user-select:none; }
  .open .scrim { opacity:1; pointer-events:auto; }
  .open .sheet { transform:none; }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
  .sh-t { font-size:24px; font-weight:700; letter-spacing:-.02em; }
  .sh-s { color:var(--mute); font-size:13px; margin-bottom:12px; }
  .sh-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; gap:2px; }
  .seg button { border:0; background:none; border-radius:999px; padding:5px 12px; font-size:13px; color:var(--mute); }
  .seg button.on { background:var(--ink); color:var(--bg); }
  .sh-steps { display:flex; gap:6px; }
  .apply { width:100%; margin-top:16px; border:0; background:var(--deep); color:#fff; border-radius:14px; padding:14px; font-weight:650; font-size:16px; }
  svg.brush { width:100%; height:auto; display:block; touch-action:none; }
  svg .bar { fill:#a1a1aa; opacity:.55; }
  svg .bar.in { fill:var(--indigo); opacity:1; }
  svg .win { fill:#6366f122; stroke:var(--deep); stroke-width:1.5; }
  svg .h { fill:var(--deep); }
  svg .hit { fill:transparent; }
  svg text { font-size:11px; fill:var(--mute); }
  svg text.big { font-size:15px; font-weight:650; fill:var(--ink); }
  svg text.we { fill:var(--deep); }
  svg .ln { stroke:var(--line); }
  svg .today { stroke:#f59e0b; stroke-width:2; }
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <b>Simulate time of day</b><br/>
    <div class="seg" id="time"><button data-t="0" class="on">3 PM</button><button data-t="1">11 PM</button></div>
    <b>Try</b>: tap ‹ ›, tap the title to open the sheet, drag in the sheet, apply. Scroll the results to see the sticky bar shrink. At 11 PM, today is empty.
    <br/><br/>
    <div id="state"></div>
  </div>
  <div class="phone" id="phone">
    <div class="scroll" id="sc">
      <div class="brand">MARQUISE</div>
      <div id="bar"></div>
      <div class="res" id="res"></div>
    </div>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>
<script>
const N = 90, T0 = Date.UTC(2026, 10, 2, 12), PX = 343; // brush drawn at real pixel width so labels stay legible
const day = (o) => new Date(T0 + o * 864e5);
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const wd = (o) => day(o).getUTCDay(), dn = (o) => day(o).getUTCDate(), mo = (o) => MO[day(o).getUTCMonth()];
const short = (o) => `${WD[wd(o)]} ${mo(o)} ${dn(o)}`;
const base = Array.from({ length: N }, (_, o) => {
  const w = wd(o);
  if (o < 35) return Math.max(1, Math.round([9, 4, 5, 6, 8, 14, 17][w] + Math.sin(o * 2.3) * 4));
  if (o < 49) return [5, 6].includes(w) ? 3 + (o % 3) : o % 4 === 0 ? 1 : 0;
  return [5, 6].includes(w) && o % 3 === 0 ? 2 : o === 60 ? 6 : 0;
});
const UI = { late: false, sheet: false, compact: false, zoom: 14, va: 0 };
const counts = () => base.map((c, o) => (o === 0 && UI.late ? 0 : c)); // upcoming only
const MAX = Math.max(...base);
const FILMS = ["Paris, Texas","In the Mood for Love","Perfect Days","Stalker","La Haine","Tampopo","Aftersun","Mon oncle","Close-Up","Chungking Express","Le Samouraï","Portrait of a Lady on Fire"];
const CIN = ["Cinéma du Parc","Cinémathèque","Cinéma Moderne","Beaubien"];
let S = { start: 0, end: 0 }, D = { ...S }; // S = applied, D = draft while the sheet is open
const R = () => (UI.sheet ? D : S);
const len = (r = R()) => r.end - r.start + 1;
const total = (r = R()) => counts().slice(r.start, r.end + 1).reduce((a, b) => a + b, 0);
const nextWd = (t, f = 0) => { let o = f; while (wd(o) !== t) o++; return o; };
const clamp = (v) => Math.max(0, Math.min(N - 1, v));
function named(r = R()) {
  const s = r.start, e = r.end, fri = nextWd(5), mon = nextWd(1, 1);
  if (s === e) return s === 0 ? "Today" : s === 1 ? "Tomorrow" : short(s);
  if (s === fri && e === fri + 2) return "This weekend";
  if (s === fri + 7 && e === fri + 9) return "Next weekend";
  if (s === mon && e === mon + 6) return "Next week";
  if (wd(s) === 5 && e === s + 2) return `Weekend of ${mo(s)} ${dn(s)}`;
  if (wd(s) === 1 && e === s + 6) return `Week of ${mo(s)} ${dn(s)}`;
  return null;
}
const rangeText = (r = R()) => r.start === r.end ? short(r.start) : `${mo(r.start)} ${dn(r.start)} → ${mo(r.end)} ${dn(r.end)}`;
const title = (r = R()) => named(r) ?? rangeText(r);
const subline = (r = R()) => `${named(r) && r.start !== r.end ? rangeText(r) + " · " : r.start === r.end && named(r) !== short(r.start) ? short(r.start) + " · " : ""}${total(r)} screenings`;

function view() { return UI.zoom === 14 ? [UI.va, UI.va + 13] : [0, UI.zoom - 1]; }
function fitView() {
  const r = R();
  UI.zoom = len() <= 7 && r.end - Math.floor(r.start / 7) * 7 < 14 ? 14 : r.end < 42 ? 42 : 90;
  if (UI.zoom === 14) { const [a, b] = view(); if (r.start < a || r.end > b) UI.va = Math.min(N - 14, Math.floor(r.start / 7) * 7); }
}
function set(s, e, live = false) {
  s = clamp(s); e = clamp(e); if (e < s) [s, e] = [e, s];
  const r = R(); if (s === r.start && e === r.end) return;
  r.start = s; r.end = e; if (!live) fitView(); render();
}
function shift(d) { const r = R(), k = /week/i.test(named() ?? "") ? 7 : len(); if (r.start + d * k < 0 || r.end + d * k > N - 1) return; set(r.start + d * k, r.end + d * k); }

function brush(H) {
  const r = R(), c = counts(), [a, b] = view(), n = b - a + 1, W = PX / n, days = n <= 14, VH = H + (days ? 40 : 20);
  let g = "";
  for (let o = a; o <= b; o++) {
    const x = (o - a) * W, h = c[o] ? Math.max(2, (c[o] / MAX) * (H - 10)) : 1;
    const line = n <= 42 ? wd(o) === 1 : dn(o) === 1;
    if (line) g += `<line class="ln" x1="${x}" x2="${x}" y1="0" y2="${H}"/>`;
    g += `<rect class="bar ${o >= r.start && o <= r.end ? "in" : ""}" x="${x + W * .15}" y="${H - h}" width="${W * .7}" height="${h}" rx="${Math.min(3, W * .2)}"/>`;
    if (days) {
      g += `<text class="${[0, 6].includes(wd(o)) ? "we" : ""}" x="${x + W / 2}" y="${H + 14}" text-anchor="middle">${WD[wd(o)][0]}</text>`;
      g += `<text class="big" x="${x + W / 2}" y="${H + 32}" text-anchor="middle">${dn(o)}</text>`;
    } else if (line) g += `<text x="${x + 2}" y="${H + 14}">${n <= 42 ? `${mo(o)} ${dn(o)}` : mo(o)}</text>`;
  }
  if (a === 0) g += `<line class="today" x1="1" x2="1" y1="0" y2="${H}"/>`;
  const s = Math.max(r.start, a), e = Math.min(r.end, b);
  if (s <= e) {
    const x0 = (s - a) * W, x1 = (e - a + 1) * W;
    g += `<rect class="win" x="${x0}" y="1" width="${x1 - x0}" height="${VH - 2}" rx="5"/>`;
    // Visible handle is thin; the hit area is 28px wide for thumbs.
    g += `<rect class="h" x="${x0 - 2.5}" y="${H / 2 - 14}" width="5" height="28" rx="2.5"/><rect class="h" x="${x1 - 2.5}" y="${H / 2 - 14}" width="5" height="28" rx="2.5"/>`;
    g += `<rect class="hit" data-h="l" x="${x0 - 14}" y="0" width="28" height="${VH}"/><rect class="hit" data-h="r" x="${x1 - 14}" y="0" width="28" height="${VH}"/>`;
  }
  return `<svg class="brush" id="br" data-a="${a}" data-b="${b}" viewBox="0 0 ${PX} ${VH}">${g}</svg>`;
}
let DRAG = null;
function dayAt(e) {
  const svg = document.getElementById("br"), rc = svg.getBoundingClientRect(), a = +svg.dataset.a, n = +svg.dataset.b - a + 1;
  return a + Math.floor(Math.max(0, Math.min(.999, (e.clientX - rc.left) / rc.width)) * n);
}
document.onpointermove = (e) => {
  if (!DRAG) return;
  const o = dayAt(e), { s0, e0, a0 } = DRAG; DRAG.moved ||= o !== a0;
  if (DRAG.mode === "move") { const d = Math.max(-s0, Math.min(N - 1 - e0, o - a0)); set(s0 + d, e0 + d, true); }
  else if (DRAG.mode === "l") set(Math.min(o, e0), e0, true);
  else if (DRAG.mode === "r") set(s0, Math.max(o, s0), true);
  else set(a0, o, true);
};
document.onpointerup = () => {
  if (!DRAG) return;
  const tap = !DRAG.moved && DRAG.mode !== "new", a0 = DRAG.a0; DRAG = null;
  if (tap) { D.start = D.end = -1; set(a0, a0); } else { fitView(); render(); }
};

function results() {
  const c = counts();
  if (S.start === S.end && c[S.start] === 0) {
    return `<div class="empty"><p>${S.start === 0 ? "No screenings left today." : "Nothing published for this day yet."}</p><button class="cta" id="tmr">See ${S.start === 0 ? "tomorrow" : "next day"} →</button></div>`;
  }
  let h = "";
  for (let o = S.start; o <= S.end; o++) {
    h += `<h4>${short(o)} · ${c[o]}</h4>`;
    if (!c[o]) { h += `<div class="f"><small>Nothing published yet</small></div>`; continue; }
    for (let i = 0; i < Math.min(4, c[o]); i++) {
      const k = (o * 5 + i * 7) % FILMS.length;
      h += `<div class="f"><span>${FILMS[k]}</span><small>${CIN[(o + i) % 4]} · ${13 + ((k + i) % 9)}:${i % 2 ? "30" : "00"}</small></div>`;
    }
  }
  return h;
}
function openSheet() { D = { ...S }; UI.sheet = true; fitView(); render(); }
function closeSheet(apply) { if (apply) S = { ...D }; UI.sheet = false; render(); }
function render() {
  const bar = document.getElementById("bar");
  bar.className = UI.compact ? "compact" : "";
  bar.innerHTML = `<div class="tb"><button class="step" data-s="-1" ${S.start === 0 ? "disabled" : ""}>‹</button>
    <button class="ttl" id="ttl"><span class="t">${title(S)}</span><small>${subline(S)}</small></button>
    <button class="step" data-s="1">›</button></div>`;
  bar.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => shift(+b.dataset.s));
  document.getElementById("ttl").onclick = openSheet;
  document.getElementById("res").innerHTML = results();
  document.getElementById("tmr")?.addEventListener("click", () => set(S.start + 1, S.start + 1));
  const ph = document.getElementById("phone"); ph.classList.toggle("open", UI.sheet);
  const sh = document.getElementById("sheet");
  if (UI.sheet) {
    sh.innerHTML = `<div class="grab"></div><div class="sh-t">${title()}</div><div class="sh-s">${subline()}</div>
      <div class="sh-row"><div class="seg">${[[14, "2 wk"], [42, "6 wk"], [90, "3 mo"]].map(([z, l]) => `<button data-z="${z}" class="${UI.zoom === z ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="sh-steps"><button class="step" data-ss="-1" ${D.start === 0 ? "disabled" : ""}>‹</button><button class="step" data-ss="1">›</button></div></div>
      ${brush(96)}
      <button class="apply" id="apply">Show ${total()} screenings</button>`;
    sh.querySelectorAll("[data-ss]").forEach((b) => b.onclick = () => shift(+b.dataset.ss));
    sh.querySelectorAll("[data-z]").forEach((b) => b.onclick = () => { UI.zoom = +b.dataset.z; if (UI.zoom === 14) { UI.va = Math.min(N - 14, Math.floor(D.start / 7) * 7); if (len() > 14) D.end = D.start + 13; } render(); });
    document.getElementById("apply").onclick = () => closeSheet(true);
    document.getElementById("br").onpointerdown = (e) => {
      e.preventDefault();
      DRAG = { s0: D.start, e0: D.end, mode: e.target.dataset.h ?? (e.target.classList.contains("win") ? "move" : "new") };
      DRAG.a0 = dayAt(e); if (DRAG.mode === "new") set(DRAG.a0, DRAG.a0, true);
    };
  }
  document.getElementById("state").textContent = `applied  ${title(S)} (${rangeText(S)})\n${UI.sheet ? `draft    ${title(D)}\nzoom     ${UI.zoom}d\n` : ""}sheet    ${UI.sheet ? "open" : "closed"}\nbar      ${UI.compact ? "compact" : "full"}\ntime     ${UI.late ? "11 PM" : "3 PM"}`;
}
document.getElementById("scrim").onclick = () => closeSheet(false);
document.querySelectorAll("#time button").forEach((b) => b.onclick = () => {
  UI.late = b.dataset.t === "1"; document.querySelectorAll("#time button").forEach((x) => x.classList.toggle("on", x === b)); render();
});
const sc = document.getElementById("sc");
sc.onscroll = () => { const c = UI.compact ? sc.scrollTop > 30 : sc.scrollTop > 60; if (c !== UI.compact) { UI.compact = c; render(); } };
render();
</script>
</body>
</html>

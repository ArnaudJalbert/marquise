<!doctype html>
<!-- PROTOTYPE, throwaway. Question: do date + search + filter chips hold up in the desktop sticky bar and on phones? -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --indigo:#6366f1; --deep:#4f46e5; --ink:var(--foreground,#18181b); --mute:var(--muted-foreground,#71717a); --line:var(--border,#e4e4e7); --bg:var(--background,#fff); }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); padding:4px 0 8px; }

  svg.i { width:15px; height:15px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* shared bits */
  .step { border:1px solid var(--line); background:transparent; border-radius:999px; width:32px; height:32px; display:grid; place-items:center; color:var(--mute); flex:none; }
  .step:disabled { opacity:.3; pointer-events:none; }
  .search { display:flex; align-items:center; gap:8px; height:36px; padding:0 8px 0 12px; border:1px solid var(--line); border-radius:10px; color:var(--mute); min-width:0; }
  .search:focus-within { border-color:var(--deep); box-shadow:0 0 0 3px #6366f12e; color:var(--ink); }
  .search input { flex:1; min-width:0; border:0; outline:none; background:none; }
  .kbd { font:11px ui-monospace,monospace; border:1px solid var(--line); border-radius:5px; padding:1px 6px; }
  .fbtn { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px; border:1px solid var(--line); background:transparent; border-radius:10px; font-size:13px; white-space:nowrap; flex:none; }
  .fbtn.has { border-color:color-mix(in srgb, var(--deep) 50%, var(--line)); color:var(--deep); background:#6366f10f; }
  .fbtn b { background:var(--deep); color:#fff; border-radius:999px; font-size:11px; min-width:18px; height:18px; display:grid; place-items:center; padding:0 5px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; gap:2px; flex:none; }
  .seg button { border:0; background:none; border-radius:999px; padding:3px 10px; font-size:12px; color:var(--mute); }
  .seg button.on { background:var(--ink); color:var(--bg); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:stretch; height:30px; border:1px solid color-mix(in srgb, var(--deep) 45%, var(--line)); background:#6366f10f; border-radius:8px; font-size:13px; overflow:hidden; max-width:100%; }
  .chip.not { border-color:color-mix(in srgb, #e11d48 45%, var(--line)); background:#e11d480d; }
  .chip > * { display:flex; align-items:center; border:0; background:none; }

  .chip .op:hover { color:var(--ink); }

  .add { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px 0 10px; border:1px dashed color-mix(in srgb, var(--mute) 60%, transparent); background:transparent; border-radius:8px; color:var(--mute); font-size:13px; }
  .add:hover { color:var(--deep); border-color:var(--deep); }
  .clear { border:0; background:none; color:var(--mute); font-size:13px; }
  .panel .ph { display:flex; align-items:center; gap:6px; padding:4px 6px 8px; font-size:12px; color:var(--mute); }

  .it { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:9px 10px; border-radius:8px; text-align:left; }
  .it:hover:not(:disabled) { background:#6366f114; }

  .none { color:var(--mute); padding:30px 0; grid-column:1/-1; }

  /* desktop */

  #dh { position:sticky; top:0; z-index:3; background:var(--bg); padding:16px 16px 14px; border-bottom:1px solid var(--line); user-select:none; }

  .drow { display:flex; align-items:center; gap:12px; }
  .dt { display:flex; align-items:center; gap:10px; flex:none; }
  .dt .t { font-size:28px; font-weight:700; letter-spacing:-.025em; }
  .dsub { color:var(--mute); font-size:13px; margin:2px 0 10px; display:flex; justify-content:space-between; align-items:center; }
  #dh.compact .dt .t { font-size:17px; min-width:110px; }
  #dh.compact .step { width:26px; height:26px; }
  #dh.compact svg.brush { flex:1; min-width:0; }
  #dh.compact .search { width:190px; flex:none; height:32px; }
  #dh.compact .fbtn { height:32px; }
  .dres { padding:4px 16px 30px; min-height:820px; }
  #dpop { position:absolute; z-index:6; width:300px; background:var(--bg); border:1px solid var(--line); border-radius:12px; box-shadow:0 16px 40px #0003; padding:6px; }

  .side { width:250px; font-size:13px; color:var(--mute); }
  .phone { width:375px; height:720px; border:10px solid #0a0a0a; border-radius:44px; overflow:hidden; position:relative; background:var(--bg); box-shadow:0 0 0 1px var(--line); }
  .pscroll { height:100%; overflow:auto; scrollbar-width:none; }
  .brand { padding:18px 18px 6px; font-weight:800; letter-spacing:.14em; font-size:13px; }
  #pbar { position:sticky; top:0; z-index:2; background:var(--bg); padding:10px 12px; border-bottom:1px solid var(--line); user-select:none; }
  #pbar.compact { box-shadow:0 6px 16px #0002; }
  .tb { display:flex; align-items:center; gap:8px; }
  .ttl { flex:1; border:0; background:none; text-align:left; padding:2px 4px; min-width:0; }
  .ttl .t { display:flex; align-items:center; gap:6px; font-weight:700; font-size:22px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ttl .t::after { content:"▾"; font-size:12px; color:var(--deep); }
  .ttl small { display:block; color:var(--mute); font-size:12px; }
  #pbar.compact .ttl .t { font-size:17px; }
  #pbar.compact .ttl small { display:none; }
  #pbar .fbtn { height:32px; padding:0 10px; }
  .psearch { display:flex; gap:8px; padding:10px 12px 0; }
  .psearch .search { flex:1; height:40px; }
  .pres { padding:4px 12px 60px; min-height:900px; }
  .scrim { position:absolute; inset:0; background:#0006; z-index:5; opacity:0; pointer-events:none; transition:opacity .2s; }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:6; background:var(--bg); border-radius:20px 20px 0 0; padding:8px 16px 18px; transform:translateY(105%); transition:transform .25s cubic-bezier(.2,.8,.2,1); max-height:92%; display:flex; flex-direction:column; }
  .phone.open .scrim { opacity:1; pointer-events:auto; }
  .phone.open .sheet { transform:none; }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 10px; flex:none; }
  .sbody { overflow:auto; flex:1; scrollbar-width:none; user-select:none; }
  .sh-t { font-size:22px; font-weight:700; letter-spacing:-.02em; }
  .sh-s { color:var(--mute); font-size:13px; margin-bottom:10px; }
  .sh-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sh-h { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:16px 0 8px; display:flex; justify-content:space-between; }
  .apply { width:100%; margin-top:12px; border:0; background:var(--deep); color:#fff; border-radius:14px; padding:14px; font-weight:650; font-size:16px; flex:none; }
</style>
</head>
<body>
<div id="tabs"></div>
<p class="q" id="q"></p>
<div id="view"></div>
<div id="state"></div>
<script>
const ICON = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', back: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  filter: '<path d="M3 5h18M6 12h12M10 19h4"/>', cin: '<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>',
  lang: '<path d="M4 5h8M8 3v2M6 5c0 4 3 7 6 8M10 5c0 4-3 7-6 8M13 20l4-9 4 9M14.5 17h5"/>', time: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;

// ---------- data: 42 days of screenings ----------
const N = 42, T0 = Date.UTC(2026, 10, 2, 12);
const day = (o) => new Date(T0 + o * 864e5);
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const wd = (o) => day(o).getUTCDay(), dn = (o) => day(o).getUTCDate(), mo = (o) => MO[day(o).getUTCMonth()];
const short = (o) => `${WD[wd(o)]} ${mo(o)} ${dn(o)}`;
const CINEMAS = ["Cinéma du Parc","Cinémathèque québécoise","Cinéma Moderne","Cinéma Public","Cinéma Beaubien","Cinéma Outremont","Cinéma Cinéma","Cinéstarz Côte-des-Neiges","Cineplex Forum","Cineplex Quartier Latin","Scotiabank Montréal","Cineplex Odeon Brossard"];
const LANGS = { orig: { label: "Original version", hint: "VO · VOA · VOF", codes: ["VO","VOA","VOF"] }, sub: { label: "Subtitled", hint: "VOSTF · VOSTA", codes: ["VOSTF","VOSTA"] }, dub: { label: "French dub", hint: "VF", codes: ["VF"] } };
const TIMES = { mat: { label: "Matinée", hint: "Before 5 PM", t: (h) => h < 17 }, eve: { label: "Evening", hint: "5 to 9 PM", t: (h) => h >= 17 && h < 21 }, late: { label: "Late", hint: "9 PM and later", t: (h) => h >= 21 } };
const CODES = ["VO","VOA","VOF","VOSTF","VOSTA","VF"], HOURS = [13, 14.5, 16, 18, 19.5, 21, 22.5];
const FILMS = ["Paris, Texas","In the Mood for Love","Perfect Days","Stalker","La Haine","Tampopo","Aftersun","Mon oncle","Close-Up","Chungking Express","Le Samouraï","Portrait of a Lady on Fire","Monsieur Lazhar","Incendies","Mommy","Past Lives","Anatomy of a Fall","The Zone of Interest"];
const SC = [];
for (let d = 0; d < N; d++) FILMS.forEach((_, f) => {
  if ((f + d) % 3 === 0 || (d > 30 && (f + d) % 2)) return;
  const n = 2 + ((f + d) % 2) + ([5, 6].includes(wd(d)) ? 1 : 0);
  for (let k = 0; k < n; k++) SC.push({ d, f, c: (f * 5 + k * 7 + d) % 12, h: HOURS[(f * 3 + k * 2 + d) % 7], code: CODES[(f * 2 + k + (d % 2)) % 6] });
});
const langOf = (code) => Object.keys(LANGS).find((k) => LANGS[k].codes.includes(code));
const timeOf = (h) => Object.keys(TIMES).find((k) => TIMES[k].t(h));
const FACETS = {
  cin: { name: "Cinema", icon: "cin", of: (s) => s.c, opts: () => CINEMAS.map((n, i) => [i, n, ""]), hint: "12 cinemas" },
  lang: { name: "Language", icon: "lang", of: (s) => langOf(s.code), opts: () => Object.entries(LANGS).map(([k, d]) => [k, d.label, d.hint]), hint: "Original, subtitled, dubbed" },
  time: { name: "Time", icon: "time", of: (s) => timeOf(s.h), opts: () => Object.entries(TIMES).map(([k, d]) => [k, d.label, d.hint]), hint: "Matinée, evening, late" },
};

// ---------- state: applied (A) and phone-sheet draft (D) ----------
const fresh = () => ({ start: 0, end: 0, f: { cin: { v: [], not: false }, lang: { v: ["dub"], not: true }, time: { v: [], not: false } }, title: "" });
let A = fresh(), D = null;
const UI = { tab: "d", compact: false, pcompact: false, sheet: false, page: "list", pop: null, zoom: 14, va: 0 };
const ST = () => (UI.tab === "p" && UI.sheet ? D : A);
const clamp = (v) => Math.max(0, Math.min(N - 1, v));
function ok(s, st, skip) {
  if (skip !== "date" && (s.d < st.start || s.d > st.end)) return false;
  for (const k in FACETS) { const F = st.f[k]; if (k !== skip && F.v.length && F.v.includes(FACETS[k].of(s)) === F.not) return false; }
  return !st.title || FILMS[s.f].toLowerCase().includes(st.title.toLowerCase());
}
const active = (st) => Object.keys(FACETS).filter((k) => st.f[k].v.length);
const total = (st) => SC.filter((s) => ok(s, st)).length;
const perDay = (st) => { const c = Array(N).fill(0); SC.forEach((s) => { if (ok(s, st, "date")) c[s.d]++; }); return c; };
const facetCounts = (st, k) => { const m = {}; SC.forEach((s) => { if (ok(s, st, k)) { const v = FACETS[k].of(s); m[v] = (m[v] ?? 0) + 1; } }); return m; };
const lab = (k, v) => FACETS[k].opts().find((o) => o[0] === v)[1];
const val = (st, k) => { const a = st.f[k].v; return a.length <= 2 ? a.map((v) => lab(k, v)).join(", ") : `${lab(k, a[0])} +${a.length - 1}`; };
const opWord = (F) => (F.not ? (F.v.length > 1 ? "is none of" : "is not") : F.v.length > 1 ? "is any of" : "is");
const nextWd = (t, f = 0) => { let o = f; while (wd(o) !== t) o++; return o; };
function named(st) {
  const s = st.start, e = st.end, fri = nextWd(5);
  if (s === e) return s === 0 ? "Today" : s === 1 ? "Tomorrow" : short(s);
  if (s === fri && e === fri + 2) return "This weekend";
  if (s === fri + 7 && e === fri + 9) return "Next weekend";
  if (wd(s) === 5 && e === s + 2) return `Weekend of ${mo(s)} ${dn(s)}`;
  if (wd(s) === 1 && e === s + 6) return `Week of ${mo(s)} ${dn(s)}`;
  return null;
}
const rtext = (st) => (st.start === st.end ? short(st.start) : `${mo(st.start)} ${dn(st.start)} → ${mo(st.end)} ${dn(st.end)}`);
const title = (st) => named(st) ?? rtext(st);

// ---------- date ----------
const view = () => (UI.zoom === 14 ? [UI.va, UI.va + 13] : [0, N - 1]);
function fitView(st) {
  UI.zoom = st.end - st.start < 7 && st.end - Math.floor(st.start / 7) * 7 < 14 ? 14 : 42;
  if (UI.zoom === 14) { const [a, b] = view(); if (st.start < a || st.end > b) UI.va = Math.min(N - 14, Math.floor(st.start / 7) * 7); }
}
function setRange(s, e, live = false) {
  const st = ST(); s = clamp(s); e = clamp(e); if (e < s) [s, e] = [e, s];
  if (s === st.start && e === st.end) return;
  st.start = s; st.end = e; if (!live) fitView(st); render();
}
function shift(d) { const st = ST(), k = /week/i.test(named(st) ?? "") ? 7 : st.end - st.start + 1; if (st.start + d * k < 0 || st.end + d * k > N - 1) return; setRange(st.start + d * k, st.end + d * k); }
function brush(id, PX, H, lab) {
  const st = ST(), c = perDay(st), max = Math.max(...perDay({ ...fresh(), f: { cin: { v: [] }, lang: { v: [] }, time: { v: [] } } }));
  const [a, b] = view(), n = b - a + 1, W = PX / n, days = n <= 14 && lab, VH = H + (lab ? (days ? 38 : 18) : 2);
  let g = "";
  for (let o = a; o <= b; o++) {
    const x = (o - a) * W, h = c[o] ? Math.max(2, (c[o] / max) * (H - 8)) : 1;
    if (wd(o) === 1) g += `<line class="ln" x1="${x}" x2="${x}" y1="0" y2="${H}"/>`;
    g += `<rect class="bar ${o >= st.start && o <= st.end ? "in" : ""}" x="${x + W * .15}" y="${H - h}" width="${W * .7}" height="${h}" rx="${Math.min(3, W * .2)}"/>`;
    if (days) {
      g += `<text class="${[0, 6].includes(wd(o)) ? "we" : ""}" x="${x + W / 2}" y="${H + 13}" text-anchor="middle">${PX < 500 ? WD[wd(o)][0] : o === 0 ? "Today" : WD[wd(o)]}</text>`;
      g += `<text class="big" x="${x + W / 2}" y="${H + 31}" text-anchor="middle">${dn(o)}</text>`;
    } else if (lab && wd(o) === 1) g += `<text x="${x + 2}" y="${H + 13}">${mo(o)} ${dn(o)}</text>`;
  }
  if (a === 0) g += `<line class="today" x1="1" x2="1" y1="0" y2="${H}"/>`;
  const s = Math.max(st.start, a), e = Math.min(st.end, b);
  if (s <= e) {
    const x0 = (s - a) * W, x1 = (e - a + 1) * W, hh = Math.min(26, H - 6);
    g += `<rect class="win" x="${x0}" y="1" width="${x1 - x0}" height="${VH - 2}" rx="4"/>`;
    g += `<rect class="h" x="${x0 - 2.5}" y="${(H - hh) / 2}" width="5" height="${hh}" rx="2.5"/><rect class="h" x="${x1 - 2.5}" y="${(H - hh) / 2}" width="5" height="${hh}" rx="2.5"/>`;
    g += `<rect class="hit" data-h="l" x="${x0 - 12}" y="0" width="24" height="${VH}"/><rect class="hit" data-h="r" x="${x1 - 12}" y="0" width="24" height="${VH}"/>`;
  }
  return `<svg class="brush" data-id="${id}" data-a="${a}" data-b="${b}" viewBox="0 0 ${PX} ${VH}">${g}</svg>`;
}
let DRAG = null;
function dayAt(e) { const svg = document.querySelector(`svg[data-id="${DRAG.id}"]`), r = svg.getBoundingClientRect(), a = +svg.dataset.a, n = +svg.dataset.b - a + 1; return a + Math.floor(Math.max(0, Math.min(.999, (e.clientX - r.left) / r.width)) * n); }
function wireBrush(root) {
  root.querySelectorAll("svg.brush").forEach((svg) => svg.onpointerdown = (e) => {
    e.preventDefault(); const st = ST();
    DRAG = { id: svg.dataset.id, s0: st.start, e0: st.end, mode: e.target.dataset.h ?? (e.target.classList.contains("win") ? "move" : "new") };
    DRAG.a0 = dayAt(e); if (DRAG.mode === "new") setRange(DRAG.a0, DRAG.a0, true);
  });
}
document.onpointermove = (e) => {
  if (!DRAG) return; const o = dayAt(e), { s0, e0, a0 } = DRAG; DRAG.moved ||= o !== a0;
  if (DRAG.mode === "move") { const d = Math.max(-s0, Math.min(N - 1 - e0, o - a0)); setRange(s0 + d, e0 + d, true); }
  else if (DRAG.mode === "l") setRange(Math.min(o, e0), e0, true);
  else if (DRAG.mode === "r") setRange(s0, Math.max(o, s0), true);
  else setRange(a0, o, true);
};
document.onpointerup = () => {
  if (!DRAG) return; const tap = !DRAG.moved && DRAG.mode !== "new", a0 = DRAG.a0; DRAG = null; const st = ST();
  if (tap) { st.start = st.end = -1; setRange(a0, a0); } else { fitView(st); render(); }
};
const zoomSeg = () => `<div class="seg">${[[14, "2 wk"], [42, "6 wk"]].map(([z, l]) => `<button data-z="${z}" class="${UI.zoom === z ? "on" : ""}">${l}</button>`).join("")}</div>`;

// ---------- filters: chips + panel pages (list / add / facet:k) ----------
const chipHtml = (st, k) => { const F = st.f[k]; return `<span class="chip ${F.not ? "not" : ""}" data-anchor="${k}"><span class="k">${ic(FACETS[k].icon)}${FACETS[k].name}</span><button class="op" data-op="${k}" title="Switch is / is not">${opWord(F)}</button><button class="v" data-edit="${k}">${val(st, k)}</button><button class="x" data-clear="${k}">${ic("x")}</button></span>`; };
function panel(st, page, inSheet) {
  if (page === "list") {
    return `<div class="panel">${inSheet ? "" : `<div class="ph">${ic("filter")}Filters</div>`}<div class="rows">${active(st).map((k) => chipHtml(st, k)).join("") || `<div class="empty-f">No filters. Showing everything.</div>`}</div>
      <div class="chips" style="padding:4px 2px">${active(st).length < 3 ? `<button class="add" data-page="add">${ic("plus")}Add filter</button>` : ""}${active(st).length > 1 ? `<button class="clear" data-clearall>Clear all</button>` : ""}</div></div>`;
  }
  if (page === "add") {
    const quick = !st.f.lang.v.length ? `<button class="it quick" data-hidedub><span class="ck" style="visibility:visible">${ic("lang")}</span><span class="lab">Hide dubbed<small>Language is not French dub</small></span></button><div style="height:1px;background:var(--line);margin:4px"></div>` : "";
    return `<div class="panel"><div class="ph"><button class="back" data-page="list">${ic("back")}</button>Filter by</div>${quick}${Object.entries(FACETS).filter(([k]) => !st.f[k].v.length).map(([k, f]) => `<button class="it" data-page="facet:${k}"><span class="ck" style="visibility:visible;color:var(--mute)">${ic(f.icon)}</span><span class="lab">${f.name}<small>${f.hint}</small></span>${ic("right")}</button>`).join("")}</div>`;
  }
  const k = page.split(":")[1], F = st.f[k], c = facetCounts(st, k);
  let opts = FACETS[k].opts(); if (k === "cin") opts.sort((a, b) => (F.v.includes(b[0]) - F.v.includes(a[0])) || (c[b[0]] ?? 0) - (c[a[0]] ?? 0));
  return `<div class="panel"><div class="ph"><button class="back" data-page="list">${ic("back")}</button>${ic(FACETS[k].icon)}${FACETS[k].name}</div>
    <div class="seg opseg"><button data-setop="${k}:0" class="${F.not ? "" : "on"}">is</button><button data-setop="${k}:1" class="${F.not ? "on" : ""}">is not</button></div>
    <div style="max-height:${inSheet ? 999 : 240}px;overflow:auto">${opts.map(([v, l, h]) => { const on = F.v.includes(v), n = c[v] ?? 0;
      return `<button class="it ${on ? "on" : ""}" data-fv="${k}|${v}" ${!n && !on ? "disabled" : ""}><span class="ck">${ic("check")}</span><span class="lab">${l}${h ? `<small>${h}</small>` : ""}</span><span class="n">${n}</span></button>`; }).join("")}</div></div>`;
}
function wireFilters(root, st, onPage) {
  root.querySelectorAll("[data-page]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); onPage(b.dataset.page); });
  root.querySelectorAll("[data-edit]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); onPage("facet:" + b.dataset.edit, b.dataset.edit); });
  root.querySelectorAll("[data-op]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); st.f[b.dataset.op].not = !st.f[b.dataset.op].not; render(); });
  root.querySelectorAll("[data-setop]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); const [k, n] = b.dataset.setop.split(":"); st.f[k].not = n === "1"; render(); });
  root.querySelectorAll("[data-clear]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); st.f[b.dataset.clear] = { v: [], not: false }; if (UI.pop?.page?.endsWith(b.dataset.clear)) UI.pop = null; render(); });
  root.querySelectorAll("[data-clearall]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); for (const k in FACETS) st.f[k] = { v: [], not: false }; render(); });
  root.querySelectorAll("[data-hidedub]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); st.f.lang = { v: ["dub"], not: true }; onPage("list"); });
  root.querySelectorAll("[data-fv]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); const [k, raw] = b.dataset.fv.split("|"), v = k === "cin" ? +raw : raw, F = st.f[k];
    F.v = F.v.includes(v) ? F.v.filter((x) => x !== v) : [...F.v, v]; render();
  });
  root.querySelectorAll("[data-z]").forEach((b) => b.onclick = () => { UI.zoom = +b.dataset.z; if (UI.zoom === 14) UI.va = Math.min(N - 14, Math.floor(ST().start / 7) * 7); render(); });
  root.querySelectorAll("[data-s]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); shift(+b.dataset.s); });
}
const searchHtml = (st, id) => `<label class="search">${ic("search")}<input id="${id}" placeholder="Search movies" value="${st.title.replace(/"/g, "&quot;")}" autocomplete="off"><span class="kbd">/</span></label>`;
function wireSearch(id) {
  const el = document.getElementById(id); if (!el) return;
  if (UI.focus === id) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  el.oninput = () => { A.title = el.value; UI.focus = id; render(); };
  el.onblur = () => { if (UI.focus === id) UI.focus = null; };
}
function results(st, cls) {
  const m = SC.filter((s) => ok(s, st)), by = {};
  m.forEach((s) => by[s.f] = (by[s.f] ?? 0) + 1);
  const fs = Object.keys(by).map(Number);
  return `<div class="sum">${fs.length} movies · ${m.length} screenings</div><div class="grid">${fs.length ? fs.map((f) => `<div class="poster" style="background:linear-gradient(160deg, hsl(${f * 47 % 360} 45% 45%), hsl(${(f * 47 + 60) % 360} 40% 22%))"><span>${FILMS[f]}</span><small>${by[f]} screening${by[f] > 1 ? "s" : ""}</small></div>`).join("") : `<div class="none">No screenings match. Remove a filter or change the date.</div>`}</div>`;
}

// ---------- desktop ----------
function renderDesktop(v) {
  const keep = document.getElementById("vp")?.scrollTop ?? 0;
  const st = A, n = active(st).length;
  const steps = (t) => `<div class="dt"><button class="step" data-s="-1" ${st.start === 0 ? "disabled" : ""}>${ic("back")}</button><span class="t">${t}</span><button class="step" data-s="1">${ic("right")}</button></div>`;
  const head = UI.compact
    ? `<div class="drow">${steps(title(st))}${brush("dmini", 260, 24, false)}${searchHtml(st, "dsq")}<button class="fbtn ${n ? "has" : ""}" data-anchor="fbtn">${ic("filter")}Filters${n ? `<b>${n}</b>` : ""}</button></div>`
    : `<div class="drow" style="justify-content:space-between">${steps(title(st))}<div style="flex:0 1 320px">${searchHtml(st, "dsq")}</div></div>
       <div class="dsub"><span>${named(st) && st.start !== st.end ? rtext(st) + " · " : ""}${total(st)} screenings</span>${zoomSeg()}</div>
       ${brush("dmain", 696, 70, true)}
       <div class="chips" style="margin-top:12px">${active(st).map((k) => chipHtml(st, k)).join("")}${n < 3 ? `<button class="add" data-anchor="add" data-dadd>${ic("plus")}${n ? "Filter" : "Add filter"}</button>` : ""}${n > 1 ? `<button class="clear" data-clearall>Clear all</button>` : ""}</div>`;
  v.innerHTML = `<div class="vp" id="vp"><div id="dh" class="${UI.compact ? "compact" : ""}">${head}</div><div class="dres">${results(st)}</div>${UI.pop ? `<div id="dpop">${panel(st, UI.pop.page, false)}</div>` : ""}</div>`;
  const vp = document.getElementById("vp"); vp.scrollTop = keep;
  vp.onscroll = () => { const c = UI.compact ? vp.scrollTop > 20 : vp.scrollTop > 150; if (c !== UI.compact) { UI.compact = c; UI.pop = null; render(); } };
  const dh = document.getElementById("dh");
  wireBrush(dh); wireSearch("dsq");
  const openPop = (page, anchor) => { UI.pop = { page, anchor: anchor ?? UI.pop?.anchor ?? "add" }; render(); };
  wireFilters(dh, st, (page, anchor) => openPop(page, anchor));
  dh.querySelector("[data-dadd]")?.addEventListener("click", (e) => { e.stopPropagation(); UI.pop?.anchor === "add" ? (UI.pop = null, render()) : openPop("add", "add"); });
  dh.querySelector('[data-anchor="fbtn"]')?.addEventListener("click", (e) => { e.stopPropagation(); UI.pop?.anchor === "fbtn" ? (UI.pop = null, render()) : openPop("list", "fbtn"); });
  const pop = document.getElementById("dpop");
  if (pop) {
    const a = dh.querySelector(`[data-anchor="${UI.pop.anchor}"]`) ?? dh.querySelector('[data-anchor="add"]') ?? dh.querySelector('[data-anchor="fbtn"]');
    const vr = vp.getBoundingClientRect(), r = a ? a.getBoundingClientRect() : vr;
    pop.style.left = Math.max(8, Math.min(r.left - vr.left, vr.width - 310)) + "px"; pop.style.top = r.bottom - vr.top + vp.scrollTop + 6 + "px";
    wireFilters(pop, st, (page) => openPop(page));
    pop.onclick = (e) => e.stopPropagation();
  }
}

// ---------- phone ----------
function renderPhone(v) {
  const keep = document.getElementById("ps")?.scrollTop ?? 0;
  const n = active(A).length;
  const fbtn = (big) => `<button class="fbtn ${n ? "has" : ""}" data-openf ${big ? 'style="height:40px"' : ""}>${ic("filter")}${big ? "Filters" : ""}${n ? `<b>${n}</b>` : ""}</button>`;
  let sheet = "";
  if (UI.sheet) {
    const st = D;
    sheet = `<div class="grab"></div><div class="sbody">
      ${UI.page === "list" ? `<div class="sh-t">${title(st)}</div><div class="sh-s">${named(st) && st.start !== st.end ? rtext(st) + " · " : ""}${total(st)} screenings</div>
        <div class="sh-row">${zoomSeg()}<div style="display:flex;gap:6px"><button class="step" data-s="-1" ${st.start === 0 ? "disabled" : ""}>${ic("back")}</button><button class="step" data-s="1">${ic("right")}</button></div></div>
        ${brush("pb", 343, 84, true)}<div class="sh-h" id="fsec"><span>Filters</span></div>` : ""}
      ${panel(st, UI.page, true)}</div>
      <button class="apply" data-apply>Show ${total(st)} screenings</button>`;
  }
  v.innerHTML = `<div class="pwrap"><div class="side">Tap the title or <b>Filters</b> to open the sheet. Inside it, date and filters are a draft until <b>Show N screenings</b>. Tap outside to cancel. Scroll the page: the search row scrolls away, the date bar stays with a Filters badge.</div>
    <div class="phone ${UI.sheet ? "open" : ""}" id="phone"><div class="pscroll" id="ps"><div class="brand">MARQUISE</div>
      <div id="pbar" class="${UI.pcompact ? "compact" : ""}"><div class="tb"><button class="step" data-s="-1" ${A.start === 0 ? "disabled" : ""}>${ic("back")}</button>
        <button class="ttl" data-opend><span class="t">${title(A)}</span><small>${total(A)} screenings</small></button>
        ${UI.pcompact ? fbtn(false) : ""}<button class="step" data-s="1">${ic("right")}</button></div></div>
      <div class="psearch">${searchHtml(A, "psq")}${fbtn(true)}</div>
      <div class="pres">${results(A)}</div></div>
      <div class="scrim" data-cancel></div><div class="sheet" id="sheet">${sheet}</div></div></div>`;
  const ps = document.getElementById("ps"); ps.scrollTop = keep;
  ps.onscroll = () => { const c = UI.pcompact ? ps.scrollTop > 40 : ps.scrollTop > 90; if (c !== UI.pcompact) { UI.pcompact = c; render(); } };
  const ph = document.getElementById("phone");
  wireSearch("psq");
  const bar = ph.querySelector("#pbar"); bar.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { if (!UI.sheet) shift(+b.dataset.s); });
  const open = (toFilters) => { D = structuredClone(A); UI.sheet = true; UI.page = "list"; fitView(D); render(); if (toFilters) document.getElementById("fsec")?.scrollIntoView({ block: "start" }); };
  ph.querySelectorAll("[data-opend]").forEach((b) => b.onclick = () => open(false));
  ph.querySelectorAll("[data-openf]").forEach((b) => b.onclick = () => open(true));
  ph.querySelector("[data-cancel]").onclick = () => { UI.sheet = false; D = null; render(); };
  const sh = document.getElementById("sheet");
  if (UI.sheet) {
    wireBrush(sh);
    wireFilters(sh, D, (page) => { UI.page = page; render(); });
    sh.querySelector("[data-apply]").onclick = () => { A = D; D = null; UI.sheet = false; render(); };
  }
}

// ---------- shell ----------
const TABS = { d: ["Desktop", "Scroll the results to see the sticky bar: date, mini brush, search, and Filters (N). Click 'is' on a chip to flip it to 'is not'. '+ Filter' starts with Hide dubbed."], p: ["Phone", ""] };
document.addEventListener("click", (e) => { if (UI.pop && document.contains(e.target) && !e.target.closest("#dpop")) { UI.pop = null; render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement?.tagName !== "INPUT") { e.preventDefault(); document.getElementById(UI.tab === "d" ? "dsq" : "psq")?.focus(); } if (e.key === "Escape" && UI.pop) { UI.pop = null; render(); } });
function render() {
  document.getElementById("tabs").innerHTML = Object.entries(TABS).map(([k, [l]]) => `<button class="${k === UI.tab ? "on" : ""}" data-tab="${k}">${l}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); UI.tab = b.dataset.tab; UI.pop = null; UI.sheet = false; UI.compact = UI.pcompact = false; fitView(A); render(); });
  document.getElementById("q").textContent = TABS[UI.tab][1];
  const v = document.getElementById("view");
  UI.tab === "d" ? renderDesktop(v) : renderPhone(v);
  const fs = (st) => Object.keys(FACETS).map((k) => st.f[k].v.length ? `${k} ${st.f[k].not ? "≠" : "="} ${st.f[k].v.join("|")}` : null).filter(Boolean).join(", ") || "none";
  document.getElementById("state").textContent = `applied  ${rtext(A)} · filters ${fs(A)} · search ${A.title || "—"} · ${total(A)} screenings${D ? `\ndraft    ${rtext(D)} · filters ${fs(D)} · ${total(D)} screenings` : ""}\nview     ${UI.tab === "d" ? (UI.compact ? "desktop sticky" : "desktop full") : (UI.sheet ? `phone sheet (${UI.page})` : UI.pcompact ? "phone sticky" : "phone top")}`;
}
render();
</script>

# Local stack on a copy of production. Driven by the justfile; see `just --list`.
name: marquise

services:
  db:
    # Same major version as the Supabase production database.
    image: postgres:17
    environment:
      POSTGRES_USER: marquise
      POSTGRES_PASSWORD: marquise
      POSTGRES_DB: marquise
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marquise", "-d", "marquise"]
      interval: 2s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/marquise-api/Dockerfile
    environment:
      # Same database as .env.local, reached over the Compose network.
      DATABASE_URL: postgresql://marquise:marquise@db:5432/marquise
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:?run through just}
      MARQUISE_API_CORS_ORIGINS: ${MARQUISE_API_CORS_ORIGINS:?run through just}
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 2s
      retries: 15

  interface:
    build:
      context: web
      dockerfile: apps/marquise-interface/Dockerfile
      args:
        VITE_MARQUISE_API_BASE_URL: ${VITE_MARQUISE_API_BASE_URL:?run through just}
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:

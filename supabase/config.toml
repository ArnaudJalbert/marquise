[storage.vector]
enabled = false

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 900
# Install scripts/migrations/265-auth-signup-policy.sql before pushing.
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

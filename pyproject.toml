[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
marquise-core = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "ty>=0.0.55",
]

[tool.ty.environment]
python-version = "3.13"
root = ["packages/marquise-core/src"]

[tool.ruff]
line-length = 88
src = [
    "packages/marquise-core/src",
    "packages/marquise-core/tests",
    "apps/marquise-api/src",
    "apps/marquise-api/tests",
    "apps/marquise-cli/src",
    "apps/marquise-cli/tests",
]

[tool.ruff.lint]
extend-select = [
    "E501", # line too long
    "ANN", # flake8 type check
    "N", # pep8 naming convention
    "R", # pylint refactor rules
    "I", # isort
    "UP", # pyupgrade (enforces str | None over Optional[str])
]

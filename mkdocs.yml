site_name: Marquise
site_description: Montreal cinema showtimes — aggregated, normalized, and queryable
repo_url: https://github.com/ArnaudJalbert/marquise
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API: api.md
  - Web Front-End: web.md
  - Sources: sources.md
  - Setup:
    - Supabase Database: setup/supabase-cinema-table.md
  - Technical Debt: todo.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/marquise-core/src]
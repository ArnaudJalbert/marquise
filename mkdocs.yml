site_name: Marquise
site_description: Open-source platform for aggregating and exploring movie showtimes
repo_url: https://github.com/anomalyco/marquise
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand

nav:
  - Home: index.md
  - Technical Debt: todo.md
  - Setup:
    - Supabase Database: setup/supabase-cinema-table.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]